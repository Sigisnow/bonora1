<style>
:root{
  color-scheme:light;
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#f0efec; --border:#dddbd2; --border-soft:#ebe9e2;
  --text:#1f1e1c; --text-2:#52514e; --text-3:#85847d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s-prev:#b9b7ae;
  --good:#0c7a0c; --good-bg:#e6f3e6; --crit:#c03030; --crit-bg:#fbe9e9; --warn:#9a6400; --warn-bg:#fdf3dc;
  --accent:#2a78d6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#383835; --border-soft:#2a2a28;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s-prev:#5a5955;
    --good:#4cc24c; --good-bg:#16301a; --crit:#ef7070; --crit-bg:#3a1c1c; --warn:#f0b43c; --warn-bg:#3a2e14;
    --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#383835; --border-soft:#2a2a28;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s-prev:#5a5955;
  --good:#4cc24c; --good-bg:#16301a; --crit:#ef7070; --crit-bg:#3a1c1c; --warn:#f0b43c; --warn-bg:#3a2e14;
  --accent:#3987e5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
body{min-height:100vh}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* blocco password */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lock-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px;width:100%;max-width:360px}
.lock-box h1{font-size:20px;font-weight:500;margin-bottom:4px}
.lock-box p{color:var(--text-3);font-size:13px;margin-bottom:18px}
.lock-box input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:16px;margin-bottom:10px}
.lock-box label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);margin-bottom:16px}
.lock-box button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.lock-err{color:var(--crit);font-size:13px;min-height:18px;margin-top:10px}

/* layout */
#app{display:none;max-width:1180px;margin:0 auto;padding:0 16px 40px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
header.top h1{font-size:20px;font-weight:500}
header.top .agg{font-size:12px;color:var(--text-3)}
.lockbtn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--text-2);cursor:pointer;margin-left:8px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:6px 0;border-bottom:1px solid var(--border);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-radius:8px;padding:8px 14px;color:var(--text-2);cursor:pointer;font-weight:500}
nav.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0 4px}
.filters select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);max-width:100%}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:var(--surface-2);color:var(--text);font-weight:600}
.note{font-size:12px;color:var(--text-3)}
section.tab{display:none}
section.tab.on{display:block}
h2.sec{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.kpi .l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.kpi .v{font-size:22px;font-weight:600}
.kpi .s{font-size:12px;color:var(--text-2);margin-top:3px}
.kpi.neg .v{color:var(--crit)} .kpi.pos .v{color:var(--good)}
.up{color:var(--good)} .down{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
.card h3{font-size:13px;font-weight:600;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--text-3);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.card{margin-top:12px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:19px}}
.chart{position:relative;height:260px}
.chart.sm{height:210px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:right;font-weight:500;color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--border-soft)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td.l,table.t th.l{text-align:left}
table.t tr.tot td{font-weight:600;background:var(--surface-2)}
table.t td.neg{color:var(--crit);font-weight:600} table.t td.pos{color:var(--good);font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:11px 13px;margin-top:8px;font-size:13px}
.alert b{display:block;margin-bottom:1px}
.alert .ico{font-weight:700;flex:0 0 auto;width:20px;text-align:center}
.alert.crit{background:var(--crit-bg);color:var(--text)} .alert.crit .ico,.alert.crit b{color:var(--crit)}
.alert.warn{background:var(--warn-bg);color:var(--text)} .alert.warn .ico,.alert.warn b{color:var(--warn)}
.alert.ok{background:var(--good-bg)} .alert.ok .ico,.alert.ok b{color:var(--good)}
.alert.info{background:var(--surface-2)} .alert.info .ico{color:var(--text-2)}
.rows .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.rows .r:last-child{border-bottom:0}
.rows .r small{display:block;color:var(--text-3);font-size:11px}
.rows .r.in .num{color:var(--good)} .rows .r.out .num{color:var(--crit)}
.rows .r.saldo{border-top:1px solid var(--border);margin-top:4px;padding-top:10px;font-weight:600;font-size:15px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.big3{grid-template-columns:1fr}}
.big3 .b{border-radius:10px;padding:14px;text-align:center;background:var(--surface);border:1px solid var(--border)}
.big3 .b .l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.big3 .b .v{font-size:24px;font-weight:700;margin-top:4px}
.big3 .b.neg{background:var(--crit-bg);border-color:transparent} .big3 .b.neg .v{color:var(--crit)}
.big3 .b.pos{background:var(--good-bg);border-color:transparent} .big3 .b.pos .v{color:var(--good)}
.bar100{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0}
.turni-wrap{overflow-x:auto}
table.turni{border-collapse:collapse;font-size:11px}
table.turni th,table.turni td{border:1px solid var(--border-soft);padding:3px 4px;text-align:center;min-width:26px}
table.turni th{background:var(--surface-2);color:var(--text-3);font-weight:500}
table.turni td.n{text-align:left;white-space:nowrap;font-weight:500;padding:3px 8px;position:sticky;left:0;background:var(--surface)}
.chip{display:inline-block;border-radius:3px;padding:0 3px;font-size:10px;font-weight:600;color:#fff}
.chip.p{background:var(--s1)} .chip.c{background:var(--s2)}
.empty{color:var(--text-3);font-size:13px;padding:12px 0}
.heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.hero{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
.hero .l{font-size:12px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.hero .v{font-size:30px;font-weight:700;margin:4px 0 6px}
.hero .f{font-size:13px;color:var(--text-2);line-height:1.4}
.hero.neg{border-color:var(--crit);background:var(--crit-bg)} .hero.neg .v{color:var(--crit)}
@media(max-width:760px){.hero .v{font-size:26px}}
ol.todo{list-style:none;display:flex;flex-direction:column;gap:8px}
ol.todo li{display:flex;gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px 16px}
ol.todo .n{flex:0 0 26px;height:26px;border-radius:13px;background:var(--crit);color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:13px}
ol.todo b{display:block;font-size:14px;margin-bottom:3px}
ol.todo p{font-size:13px;color:var(--text-2);margin-bottom:8px}
button.go{background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:12px;color:var(--accent);cursor:pointer}
details.det{background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-top:12px}
details.det>summary{padding:13px 16px;cursor:pointer;font-weight:600;font-size:13px;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.det>summary::-webkit-details-marker{display:none}
details.det>summary::after{content:'Apri ▾';font-weight:400;font-size:12px;color:var(--accent)}
details.det[open]>summary::after{content:'Chiudi ▴'}
details.det>.in{padding:0 16px 16px}
details.det .card{border:0;padding:0;margin-top:12px;background:none}
footer{margin-top:30px;font-size:11px;color:var(--text-3);text-align:center}
</style>
</head>
<body>

<div id="lock">
  <form class="lock-box" id="lockform" autocomplete="on">
    <h1>La Bonora</h1>
    <p>Dashboard riservata. Inserisci la password.</p>
    <input type="text" name="username" value="bonora" autocomplete="username" style="display:none">
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
    <label><input type="checkbox" id="remember" checked> Ricorda su questo dispositivo</label>
    <button type="submit" id="unlockbtn">Apri</button>
    <div class="lock-err" id="lockerr"></div>
  </form>
</div>

<div id="app">
  <header class="top">
    <h1>La Bonora</h1>
    <div class="agg"><span id="agg"></span><button class="lockbtn" id="logout" type="button">Esci</button></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-t="home" class="on">Come stiamo</button>
    <button data-t="incassi">Incassi</button>
    <button data-t="costi">Costi</button>
    <button data-t="cassa">Cassa</button>
    <button data-t="dipendenti">Persone</button>
  </nav>
  <div class="filters">
    <select id="periodo" aria-label="Periodo"></select>
    <div class="seg" id="locale" role="group" aria-label="Locale">
      <button data-l="Tutti" class="on">Tutti</button><button data-l="Appio">Appio</button><button data-l="N Antro">N Antro</button>
    </div>
    <span class="note" id="fnote"></span>
  </div>
  <section class="tab on" id="t-home"></section>
  <section class="tab" id="t-incassi"></section>
  <section class="tab" id="t-costi"></section>
  <section class="tab" id="t-cassa"></section>
  <section class="tab" id="t-dipendenti"></section>
  <footer id="foot"></footer>

const ITER = 250000;
const LS_KEY = 'bonora_pw';

/* ───────────── sblocco ───────────── */
async function decifra(pw){
  const raw = Uint8Array.from(atob(ENC), c => c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, km,
                                            {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function lsGet(){ try{ return localStorage.getItem(LS_KEY); }catch(e){ return null; } }
function lsSet(v){ try{ v ? localStorage.setItem(LS_KEY, v) : localStorage.removeItem(LS_KEY); }catch(e){} }

async function sblocca(pw, ricorda){
  const err = document.getElementById('lockerr');
  const btn = document.getElementById('unlockbtn');
  btn.disabled = true; btn.textContent = 'Apertura…'; err.textContent = '';
  try{
    const D = await decifra(pw);
    if (ricorda) lsSet(pw);
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    avvia(D);
  }catch(e){
    lsSet(null);
    err.textContent = (window.crypto && crypto.subtle) ? 'Password errata.' : 'Browser non supportato: apri la pagina da https.';
  }finally{ btn.disabled = false; btn.textContent = 'Apri'; }
}
document.getElementById('lockform').addEventListener('submit', e => {
  e.preventDefault();
  sblocca(document.getElementById('pw').value, document.getElementById('remember').checked);
});
document.getElementById('logout').addEventListener('click', () => { lsSet(null); location.reload(); });

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);

let D, S = {tab:'home', periodo:'ytd', locale:'Tutti', dip:'Tutti'}, CHARTS = [];

/* ───────────── periodi ───────────── */
function costruisciPeriodi(){
  const ultima = D.meta.ultima_chiusura, Y = +ultima.slice(0,4), inizio = D.meta.inizio;
  const P = [{k:'ytd', label:`Anno ${Y} (dal 1/1)`, from: inizio, to: ultima}];
  for (let m = +ultima.slice(5,7); m >= 1; m--){
    const k = `${Y}-${String(m).padStart(2,'0')}`;
    const last = new Date(Y, m, 0).getDate();
    P.push({k:'m:'+k, label: ymLabel(k) + (k === ym(ultima) ? ' (in corso)' : ''), from: k+'-01', to: (k === ym(ultima) ? ultima : `${k}-${last}`), mese:k});
  }
  P.push({k:'30g', label:'Ultimi 30 giorni', from: addDays(ultima,-29), to: ultima, breve:true});
  P.push({k:'7g',  label:'Ultimi 7 giorni',  from: addDays(ultima,-6),  to: ultima, breve:true});
  return P;
}
let PERIODI = [];
function per(){ return PERIODI.find(p => p.k === S.periodo) || PERIODI[0]; }
function prevYear(s){ return (+s.slice(0,4) - 1) + s.slice(4); }
function mesiDi(p){ const out = []; let k = ym(p.from); while (k <= ym(p.to)){ out.push(k); let y=+k.slice(0,4), m=+k.slice(5,7)+1; if (m>12){m=1;y++;} k = `${y}-${String(m).padStart(2,'0')}`; } return out; }
const inP = (d, p) => d >= p.from && d <= p.to;
const locOk = l => S.locale === 'Tutti' || l === S.locale;

/* ───────────── aggregati ───────────── */
// chiusure: [data, locale, tot, contanti, carta, altro, scontrini, diff]
function agCh(p, loc = true){
  const r = D.chiusure.filter(c => inP(c[0], p) && (!loc || locOk(c[1])));
  return { righe:r, tot:sum(r,c=>c[2]), contanti:sum(r,c=>c[3]), carta:sum(r,c=>c[4]), nero:sum(r,c=>c[5]),
           fisc:sum(r,c=>c[4]+c[3]-c[5]), scontrini:sum(r,c=>c[6]), giorni:new Set(r.map(c=>c[0])).size };
}
function agChPrev(p, loc = true){ return agCh({from:prevYear(p.from), to:prevYear(p.to)}, loc); }
// spese: [data, locale, fornitore, categoria, importo, fatt, modalita, nft]
function agSp(p, loc = true){
  const r = D.spese.filter(s => inP(s[0], p) && (!loc || locOk(s[1])));
  const nf = r.filter(s => !s[5]);
  return { righe:r, tot:sum(r,s=>s[4]), fatt:sum(r.filter(s=>s[5]),s=>s[4]), nonfatt:sum(nf,s=>s[4]),
           neroDip:sum(nf.filter(s=>s[3]==='Dipendente'),s=>s[4]), neroAltro:sum(nf.filter(s=>s[3]!=='Dipendente'),s=>s[4]) };
}
// fatture: [data, fornitore, totale, imponibile, cat, tipo]
function agFt(p){ const r = D.fatture.filter(f => inP(f[0], p)); return { righe:r, tot:sum(r,f=>f[2]), imp:sum(r,f=>f[3]) }; }
// paghe: solo per mesi interi (non per 7/30 giorni)
function agPg(p){
  if (p.breve) return null;
  const mesi = mesiDi(p), have = mesi.filter(k => D.paghe[k]);
  const g = k => D.paghe[k];
  return { mesi, have, mancanti: mesi.filter(k => !D.paghe[k] && k < ym(D.meta.ultima_chiusura)),
           lordo:sum(have,k=>g(k).lordo), netto:sum(have,k=>g(k).netto), f24:sum(have,k=>g(k).f24),
           tfr:sum(have,k=>g(k).tfr), inail:sum(have,k=>g(k).inail), ratei:sum(have,k=>g(k).ratei) };
}
function bilancio(p, perLocale){
  // il nero si divide per locale; il chiaro (fatture, paghe) solo sul totale
  const all = !perLocale || S.locale === 'Tutti';
  const c = agCh(p, !!perLocale), f = agFt(p), s = agSp(p, !!perLocale), g = agPg(p);
  const pers = g ? g.netto + g.f24 : 0;
  const np = neroPers(p, !!perLocale), neroUscito = s.neroAltro + np.tot;
  const chiaro = all ? c.fisc - f.tot - pers : null, nero = c.nero - neroUscito;
  return { c, f, s, g, np, pers, chiaro, nero, neroUscito, all, totale: all ? chiaro + nero : null };
}

function chart(id, cfg){
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  const grid = css('--border-soft'), tick = css('--text-3');
  cfg.options = Object.assign({responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:'index', intersect:false},
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${eur(c.raw ?? 0)}`}}}}, cfg.options || {});
  const sc = cfg.options.scales || {};
  for (const ax of Object.values(sc)){
    ax.grid = Object.assign({color:grid, drawTicks:false}, ax.grid||{});
    ax.ticks = Object.assign({color:tick, font:{size:11}}, ax.ticks||{});
    ax.border = {display:false};
  }
  CHARTS.push(new Chart(el, cfg));
}

function cartaGap(p){
  const b = D.banca.filter(m => inP(m[0], p));
  const add = c => sum(b.filter(m => m[2] === c), m => -m[1]);
  const reg = c => sum(D.spese.filter(x => x[6] === c && inP(x[0], p)), x => x[4]);
  return { amex:add('Carta Amex'), amexReg:reg('Amex'), bcc:add('Carta BCC'), bccReg:reg('Carta BCC') };
}

function cosaFare(p, B, k){
  const out = [];
  if (k && S.locale === 'Tutti' && k.nonVersati > 1000) out.push({tab:'cassa', t:`Capire dove sono finiti ${eur(k.nonVersati)} di contanti`,
    f:`Sono contanti dichiarati alla cassa che non risultano versati in banca né spesi con fattura. Vanno versati, oppure registrati nel modulo spese con il motivo per cui sono usciti.`});
  if (B.np.sbSenzaTariffa.length) out.push({tab:'dipendenti', t:'Registrare i pagamenti in nero ai collaboratori',
    f:`${sum(B.np.sbSenzaTariffa, x => x.turni)} turni lavorati da persone senza busta paga (${B.np.sbSenzaTariffa.slice(0,5).map(x => esc(x.nome)).join(', ')}${B.np.sbSenzaTariffa.length > 5 ? '…' : ''}), ma nel modulo spese non c'è nessun pagamento per loro.`});
  if (D.banca.length && S.locale === 'Tutti'){
    const g = cartaGap(p), manca = (g.amex - g.amexReg) + (g.bcc - g.bccReg);
    if (manca > 2000) out.push({tab:'costi', t:`Registrare nel modulo le spese fatte con le carte: mancano circa ${eur(manca)}`,
      f:`Amex: addebitati in banca ${eur(g.amex)}, registrati nel modulo ${eur(g.amexReg)}. Carta BCC: addebitati ${eur(g.bcc)}, registrati ${eur(g.bccReg)}.`});
  }
  const org = organico(p);
  if (org.mancanti.length > 5){
    const perLoc = {}; org.mancanti.forEach(x => perLoc[x.loc] = (perLoc[x.loc] || 0) + 1);
    out.push({tab:'dipendenti', t:`Inserire i turni: mancano ${org.mancanti.length} giorni di apertura`,
      f:Object.entries(perLoc).map(([l, n]) => `${esc(l)}: ${n} giorni`).join(' · ') + '. Senza turni non si può calcolare costo e resa del personale.'});
  }
  if (B.g && B.g.mancanti.length) out.push({tab:'dipendenti', t:`Buste paga mancanti: ${B.g.mancanti.map(ymLabel).join(', ')}`, f:'Controllare che le mail del consulente paghe arrivino a risorseumane@.'});
  return out;
}

function rHome(){
  const p = per(), B = bilancio(p, true), cp = agChPrev(p), all = S.locale === 'Tutti';
  const k = D.banca.length ? cassaMese(p) : null, Y = +D.meta.ultima_chiusura.slice(0,4);
  const pers = B.g ? B.pers + B.np.tot : null;
  let h = `<h2 class="sec">Come stiamo · ${esc(p.label)} · ${all ? 'tutti i locali' : S.locale}</h2><div class="heroes">`;
  h += hero('Incassato', eur(B.c.tot), `${delta(B.c.tot, cp.tot)} rispetto allo stesso periodo del ${Y-1} (${eur(cp.tot)})`);
  h += all ? hero('Speso', eur(B.f.tot + (pers || 0)), `fornitori ${eur(B.f.tot)} · personale ${pers != null ? eur(pers) : 'n/d'}${pers != null ? ` (${pct(B.f.tot + pers, B.c.tot)} dell'incassato)` : ''}`)
           : hero('Speso', '—', 'fatture e buste paga sono della società: si vedono solo su "Tutti"');
  h += (k && all) ? hero('Contanti non arrivati in banca', eur(k.nonVersati), `dichiarati ${eur(k.cfisc)} · versati ${eur(k.vers)} · spesi con fattura ${eur(k.spContFatt)}`, k.nonVersati > 1000 ? 'neg' : '')
                  : hero('Contanti non arrivati in banca', '—', all ? 'serve l\'estratto conto' : 'solo su "Tutti"');
  h += hero('Nero incassato', eur(B.c.nero), B.np.sbSenzaTariffa.length ? `uscite registrate solo ${eur(B.neroUscito)}: i pagamenti ai collaboratori non sono registrati, quindi non si sa dove sia finito il resto` : `uscito ${eur(B.neroUscito)} · resta ${eurS(B.nero)}`, B.np.sbSenzaTariffa.length ? 'neg' : '');
  h += `</div>`;
  const todo = cosaFare(p, B, k);
  h += `<h2 class="sec">Cose da fare</h2>`;
  if (!todo.length) h += alertBox('ok', 'Niente di urgente', 'Tutti i dati principali tornano.');
  else h += `<ol class="todo">` + todo.slice(0, 3).map((x, i) => `<li><span class="n">${i+1}</span><div><b>${x.t}</b><p>${x.f}</p><button type="button" class="go" data-vai="${x.tab}">Vedi dettaglio →</button></div></li>`).join('') + `</ol>`;
  h += `<div class="card"><h3>Incassato mese per mese</h3><div class="sub">${all ? 'Tutti i locali' : S.locale}, ${Y} contro ${Y-1}</div>` +
       legend([[css('--s1'), Y], [css('--s-prev'), Y-1]]) + `<div class="chart sm"><canvas id="c-rie"></canvas></div></div>`;
  const nAvv = (avvisi(p, B).match(/class="alert /g) || []).length;
  h += det(`Tutti i controlli (${nAvv})`, avvisi(p, B) + (todo.length > 3 ? '<p class="note" style="margin-top:8px">Altre cose da fare: ' + todo.slice(3).map(x => x.t).join(' · ') + '</p>' : ''));
  document.getElementById('t-home').innerHTML = h;
  document.querySelectorAll('#t-home [data-vai]').forEach(b => b.onclick = () => vai(b.dataset.vai));
  const mens = y => MESI.map((_, i) => { const m = `${y}-${String(i+1).padStart(2,'0')}`; const v = sum(D.chiusure.filter(c => c[0].startsWith(m) && locOk(c[1])), c => c[2]); return v || null; });
  chart('c-rie', {type:'bar', data:{labels:MESI, datasets:[barDs(String(Y), mens(Y), css('--s1')), barDs(String(Y-1), mens(Y-1), css('--s-prev'))]}, options:{scales:yEur}});
}

/* ───────────── COSTI ───────────── */
function contoHTML(p){
  const b = D.banca.filter(m => inP(m[0], p)), cats = {};
  b.forEach(m => { (cats[m[2]] = cats[m[2]] || []).push(m); });
  const cs = Object.entries(cats).map(([c, l]) => [c, l, sum(l, m => m[1])]).sort((a, b) => a[2] - b[2]);
  return `<div class="kpis">` + kpi('Entrate', eur(sum(b.filter(m => m[1] > 0), m => m[1]))) + kpi('Uscite', eur(-sum(b.filter(m => m[1] < 0), m => m[1]))) +
         kpi('Differenza', eurS(sum(b, m => m[1])), '', sum(b, m => m[1]) < 0 ? 'neg' : 'pos') + `</div><div class="card"><h3>Per categoria</h3><div class="sub">Tocca una riga per vedere i movimenti</div>` +
         cs.map(([c, l, t]) => `<details style="border-bottom:1px solid var(--border-soft);padding:8px 0"><summary style="display:flex;justify-content:space-between;cursor:pointer;font-size:13px"><span>${esc(c)} <span class="note">(${l.length})</span></span><span class="num" style="color:${t < 0 ? 'var(--crit)' : 'var(--good)'}">${eurS(t)}</span></summary>` +
           `<div class="tbl-wrap" style="margin-top:8px"><table class="t"><tbody>` + [...l].reverse().slice(0, 200).map(m => `<tr><td>${dLabel(m[0])}</td><td class="l">${esc(m[3])}</td><td class="l note">${esc(m[4]).slice(0, 60)}</td><td class="num">${eurS(m[1])}</td></tr>`).join('') + `</tbody></table></div></details>`).join('') +
         `<p class="note" style="margin-top:8px">Movimenti fino al ${D.banca.length ? D.banca[D.banca.length-1][0].split('-').reverse().join('/') : '—'}.</p></div>`;
}
function carteHTML(p){
  const g = cartaGap(p), ab = abbinaCarte(p), nr = ab.filter(x => !x.reg);
  let h = `<div class="kpis">` +
    kpi('Amex addebitata in banca', eur(g.amex), `registrata nel modulo spese: <b>${eur(g.amexReg)}</b>`, g.amex > g.amexReg * 1.2 ? 'neg' : '') +
    kpi('Carta BCC addebitata in banca', eur(g.bcc), `registrata nel modulo spese: <b>${eur(g.bccReg)}</b>`, g.bcc > g.bccReg * 1.2 ? 'neg' : '') +
    kpi('Operazioni non registrate', eur(sum(nr, x => x.o[3])), `${nr.length} su ${ab.length} negli estratti caricati`, nr.length ? 'neg' : '') + `</div>`;
  h += `<p class="note">L'addebito in banca di un mese paga le spese del mese prima: su periodi brevi i numeri non coincidono, sull'anno sì.</p>`;
  if (!D.carte.length) return h + alertBox('info', 'Estratti carte non caricati', 'Metti i PDF in "estratti conto/amex" e "estratti conto/bcc".');
  return h + `<div class="card"><h3>Operazioni con carta non trovate nel modulo spese</h3><div class="sub">Stessa carta, stesso importo, data vicina: se nel modulo non c'è, finisce qui</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Data</th><th class="l">Carta</th><th class="l">Esercente</th><th class="l">Tipo</th><th>Importo</th></tr></thead><tbody>` +
    nr.slice().reverse().map(x => `<tr><td>${dLabel(x.o[0])}</td><td class="l">${esc(x.o[1])}</td><td class="l">${esc(x.o[2])}</td><td class="l note">${esc(x.o[4])}</td><td class="num">${eur(x.o[3])}</td></tr>`).join('') +
    `</tbody></table></div>${nr.length ? '' : '<div class="empty">Tutte le operazioni risultano registrate.</div>'}</div>`;
}
function rCosti(){
  const p = per(), f = agFt(p), g = agPg(p), np = neroPers(p, false), s = agSp(p), all = S.locale === 'Tutti';
  const cg = D.banca.length ? cartaGap(p) : null;
  let h = `<h2 class="sec">Dove vanno i soldi · ${esc(p.label)}</h2><div class="heroes">`;
  h += hero('Fornitori', eur(f.tot), `fatture elettroniche ricevute, IVA inclusa · ${pct(f.tot, agCh(p, false).tot)} dell'incassato`);
  h += hero('Personale', g ? eur(g.netto + g.f24 + np.tot) : '—', g ? `buste paga ${eur(g.netto)} · tasse e contributi (F24) ${eur(g.f24)} · nero ${eur(np.tot)}` : 'per 7/30 giorni non disponibile: le paghe sono mensili');
  h += hero('Carte aziendali', cg ? eur(cg.amex + cg.bcc) : '—', cg ? `Amex ${eur(cg.amex)} · BCC ${eur(cg.bcc)} addebitate in banca · registrate nel modulo solo ${eur(cg.amexReg + cg.bccReg)}` : 'serve l\'estratto conto', cg && (cg.amex + cg.bcc) > (cg.amexReg + cg.bccReg) * 1.2 ? 'neg' : '');
  h += hero('Spese senza fattura', eur(s.nonfatt), `registrate nel modulo spese${all ? '' : ' · ' + esc(S.locale)}`);
  h += `</div>`;
  if (!all) h += `<p class="note">Fatture, personale e carte sono della società: qui sono sempre il totale. Il filtro locale vale per le spese del modulo.</p>`;
  h += det('Fornitori e spese del modulo', '<div id="t-spese"></div>');
  if (D.banca.length){
    h += det('Carte aziendali: cosa non è registrato', carteHTML(p));
    h += det('Conto corrente: tutte le uscite per categoria', contoHTML(p));
  }
  h += `<p class="note" style="margin-top:12px">Il dettaglio del personale (buste, turni, costo per persona) è nella scheda <a href="#" data-vai="dipendenti" style="color:var(--accent)">Persone</a>.</p>`;
  document.getElementById('t-costi').innerHTML = h;
  document.querySelectorAll('#t-costi [data-vai]').forEach(b => b.onclick = e => { e.preventDefault(); vai(b.dataset.vai); });
  rSpese();
}

/* ───────────── CASSA ───────────── */
function rCassa(){
  const p = per(), el = document.getElementById('t-cassa'), after = [], all = S.locale === 'Tutti';
  let h = '';
  if (D.banca.length && all){
    const k = cassaMese(p);
    h += `<h2 class="sec">Contanti dichiarati · ${esc(p.label)}</h2><div class="heroes">` +
      hero('Incassati in contanti', eur(k.cfisc), 'contanti delle chiusure, escluso il nero') +
      hero('Versati in banca', eur(k.vers), pct(k.vers, k.cfisc) + ' dei contanti dichiarati', k.vers < k.cfisc * 0.5 ? 'neg' : '') +
      hero('Spesi con fattura', eur(k.spContFatt), 'spese pagate in contanti, registrate nel modulo') +
      hero('Non arrivati in banca', eur(k.nonVersati), 'per la contabilità sono ancora in cassa: è questo che fa crescere la cassa a bilancio', k.nonVersati > 1000 ? 'neg' : '') + `</div>`;
    const mesi = mesiAnno(); let cum = 0;
    const rows = mesi.map(m => { const r = cassaMese(rangeMese(m)); cum += r.nonVersati; return Object.assign({m, cum}, r); });
    h += `<div class="card"><h3>Contanti non arrivati in banca, accumulati da gennaio</h3><div class="sub">Barre: contanti dichiarati incassati e versati ogni mese. Linea: quanto si è accumulato senza arrivare in banca.</div>` +
         legend([[css('--s1'),'Incassati'],[css('--s3'),'Versati'],[css('--crit'),'Non arrivati in banca (accumulato)']]) + `<div class="chart"><canvas id="c-cassa"></canvas></div></div>`;
    h += det('Tabella mese per mese', `<div class="tbl-wrap"><table class="t"><thead><tr><th>Mese</th><th>Incassati</th><th>Versati</th><th>Spesi con fattura</th><th>Non arrivati</th><th>Accumulato</th></tr></thead><tbody>` +
         rows.map(r => `<tr><td>${MESI[+r.m.slice(5)-1]}</td><td class="num">${eur(r.cfisc)}</td><td class="num">${eur(r.vers)}</td><td class="num">${eur(r.spContFatt)}</td><td class="num ${r.nonVersati > 0 ? 'neg' : ''}">${eur(r.nonVersati)}</td><td class="num neg">${eur(r.cum)}</td></tr>`).join('') + `</tbody></table></div>`);
    after.push(() => chart('c-cassa', {type:'bar', data:{labels:rows.map(r => MESI[+r.m.slice(5)-1]), datasets:[
      lineDs('Non arrivati in banca (accumulato)', rows.map(r => r.cum), css('--crit'), {order:0}),
      barDs('Incassati', rows.map(r => r.cfisc), css('--s1'), {order:1}),
      barDs('Versati', rows.map(r => r.vers), css('--s3'), {order:1})]}, options:{scales:yEur}}));
    h += det('Incassi con carta: chiusure e accrediti Nexi', `<div class="tbl-wrap"><table class="t"><thead><tr><th>Mese</th><th>Carta nelle chiusure</th><th>Accreditato Nexi</th><th>Differenza</th></tr></thead><tbody>` +
         rows.map(r => { const d = r.nexi - r.carta; return `<tr><td>${MESI[+r.m.slice(5)-1]}</td><td class="num">${eur(r.carta)}</td><td class="num">${eur(r.nexi)}</td><td class="num ${Math.abs(d) > r.carta * 0.05 ? 'neg' : ''}">${eurS(d)}</td></tr>`; }).join('') +
         `<tr class="tot"><td>Totale</td><td class="num">${eur(sum(rows,r=>r.carta))}</td><td class="num">${eur(sum(rows,r=>r.nexi))}</td><td class="num">${eurS(sum(rows,r=>r.nexi - r.carta))}</td></tr></tbody></table></div><p class="note" style="margin-top:6px">Le carte tornano: piccole differenze mensili sono normali (Nexi accredita il giorno dopo e trattiene le commissioni).</p>`);
  } else if (!D.banca.length) h += alertBox('info', 'Estratto conto non caricato', 'Metti l\'export dei movimenti in "estratti conto/conto corrente" per vedere i contanti versati.');
  else h += `<p class="note" style="margin-top:16px">I contanti versati in banca si vedono solo su "Tutti": il conto è unico per i due locali.</p>`;
  h += `<div id="t-bilancio"></div>`;
  el.innerHTML = h;
  after.forEach(f => f());
  rBilancio();
}

function avvisi(p, B){
  const out = [];
  if (B.nero < 0) out.push(alertBox('crit', `Nero speso superiore al nero incassato: ${eur(-B.nero)}`,
     `Nel periodo sono usciti ${eur(B.neroUscito)} in nero (di cui ${eur(B.np.tot)} personale) a fronte di ${eur(B.c.nero)} incassati non fiscalizzati. La differenza è stata pagata con soldi del chiaro.`));
  else if (B.np.sbSenzaTariffa.length) out.push(alertBox('crit', `Saldo nero non affidabile: mancano i pagamenti al personale in nero`,
     `Incassati ${eur(B.c.nero)} non fiscalizzati, spesi ${eur(B.neroUscito)} registrati. Ma ${sum(B.np.sbSenzaTariffa, x => x.turni)} turni sono stati lavorati da persone senza busta (${B.np.sbSenzaTariffa.slice(0,8).map(x => `${esc(x.nome)} ${x.turni}`).join(', ')}${B.np.sbSenzaTariffa.length > 8 ? '…' : ''}) e nessun pagamento risulta registrato. Inserisci in config.json quanto prende ognuno a turno ("tariffe_turno_nero") per avere il saldo vero.`));
  else if (B.c.nero > 0) out.push(alertBox('ok', 'Nero in equilibrio', `Incassati ${eur(B.c.nero)}, spesi ${eur(B.neroUscito)}: avanzo ${eur(B.nero)}.`));
  if (B.g && B.g.mancanti.length){
    const ult = D.meta.ultima_chiusura, mc = ym(ult);
    const attesi = B.g.mancanti.filter(k => k < mc);
    if (attesi.length) out.push(alertBox('warn', `Buste paga mancanti: ${attesi.map(ymLabel).join(', ')}`,
       'Il costo del personale e il saldo chiaro di questi mesi sono incompleti. Controllare la casella risorseumane@.'));
  }
  const diff = B.c.righe.filter(c => Math.abs(c[7]) >= 1);
  if (diff.length) out.push(alertBox('warn', `${diff.length} chiusure non quadrano (finanziario ≠ pagamenti)`,
     diff.slice(-6).map(c => `${dLabel(c[0])} ${esc(c[1])}: ${eurS(c[7])}`).join(' · ')));
  const strani = B.c.righe.filter(c => c[5] > c[3] + 1);
  if (strani.length) out.push(alertBox('warn', `${strani.length} giorni con non fiscalizzato maggiore dei contanti`,
     'Il nero non può superare i contanti incassati: probabilmente nel campo "Altro" sono finite anche fatture emesse. Giorni: ' + strani.slice(-6).map(c => `${dLabel(c[0])} ${esc(c[1])}`).join(', ')));
  const vis = {}, dup = [];
  B.s.righe.forEach(s => { const k = s[0]+'|'+s[2].toUpperCase()+'|'+s[4]; if (vis[k]) dup.push(s); vis[k] = 1; });
  if (dup.length) out.push(alertBox('warn', `${dup.length} spese forse inserite due volte nel modulo`,
     dup.slice(0,6).map(s => `${dLabel(s[0])} ${esc(s[2])} ${eur(s[4])}`).join(' · ')));
  if (D.banca.length && S.locale === 'Tutti'){ const k = cassaMese(p); if (k.nonVersati > 1000) out.push(alertBox('crit', `Contanti non versati in banca: ${eur(k.nonVersati)}`,
     `Incassati ${eur(k.cfisc)} in contanti fiscalizzati, versati ${eur(k.vers)}, spesi con fattura ${eur(k.spContFatt)}. Il resto per la contabilità è ancora in cassa. Vedi scheda "Cassa".`)); }
  const org = organico(p);
  if (org.mancanti.length) out.push(alertBox('warn', `${org.mancanti.length} giorni di apertura senza turni inseriti`, 'Ultimi: ' + org.mancanti.slice(-6).map(x => `${dLabel(x.d)} ${esc(x.loc)}`).join(', ')));
  const futuro = D.spese.filter(s => s[0] > addDays(D.meta.ultima_chiusura, 1));
  if (futuro.length) out.push(alertBox('warn', `${futuro.length} ${futuro.length === 1 ? 'spesa' : 'spese'} con data nel futuro`, futuro.map(s => `${s[0].split('-').reverse().join('/')} ${esc(s[2])} ${eur(s[4])}`).join(' · ') + ': probabile errore di battitura nel modulo.'));
  const senzaN = B.s.righe.filter(s => s[5] && !String(s[7]||'').trim());
  if (senzaN.length) out.push(alertBox('info', `${senzaN.length} spese segnate "fatturate" senza numero fattura`, 'Non si possono abbinare alla fattura elettronica.'));
  const gen = D.meta.generato.slice(6,10)+'-'+D.meta.generato.slice(3,5)+'-'+D.meta.generato.slice(0,2);
  const giorniDa = s => s ? Math.round((dObj(gen) - dObj(s)) / 864e5) : 999;
  if (giorniDa(D.meta.ultima_chiusura) > 2) out.push(alertBox('warn', 'Chiusure di cassa ferme', `Ultima chiusura: ${dLabel(D.meta.ultima_chiusura)}.`));
  if (giorniDa(D.meta.ultima_spesa) > 7) out.push(alertBox('info', 'Modulo spese fermo', `Ultima spesa inserita: ${D.meta.ultima_spesa ? dLabel(D.meta.ultima_spesa) : 'nessuna'}.`));
  if (giorniDa(D.meta.ultima_fattura) > 10) out.push(alertBox('info', 'Fatture non aggiornate', `Ultima fattura: ${D.meta.ultima_fattura ? dLabel(D.meta.ultima_fattura) : 'nessuna'}. Scaricare gli XML nella cartella fatture.`));
  (D.avvisi_sistema || []).forEach(a => out.push(alertBox('info', `Aggiornamento: ${esc(a.fonte)}`, esc(a.testo))));
  return out.join('') || alertBox('ok', 'Nessun avviso', '');
}

/* ───────────── INCASSI ───────────── */
function rIncassi(){
  const p = per(), c = agCh(p), cp = agChPrev(p), Y = +p.to.slice(0,4);
  const pxR = D.pax.filter(x => inP(x[0], p)), pax = sum(pxR, x => x[1]);
  const appio = (S.locale === 'N Antro') ? null : agCh(p, false).righe.filter(r => r[1] === 'Appio' && pxR.some(x => x[0] === r[0]));
  const totAppioPax = appio ? sum(appio, r => r[2]) : 0;
  let h = `<h2 class="sec">${esc(p.label)} · ${S.locale}</h2><div class="kpis">`;
  h += kpi('Incasso', eur(c.tot), `${delta(c.tot, cp.tot)} vs ${Y-1} (${eur(cp.tot)})`);
  h += kpi('Scontrini', c.scontrini.toLocaleString('it-IT'), `${delta(c.scontrini, cp.scontrini)} vs ${Y-1}`);
  h += kpi('Scontrino medio', c.scontrini ? '€ ' + (c.tot/c.scontrini).toLocaleString('it-IT',{maximumFractionDigits:2}) : '—', cp.scontrini ? `${Y-1}: € ${(cp.tot/cp.scontrini).toLocaleString('it-IT',{maximumFractionDigits:2})}` : '');
  h += kpi('PAX (solo Appio)', S.locale === 'N Antro' ? '—' : pax.toLocaleString('it-IT'), pax ? `spesa media a persona € ${(totAppioPax/pax).toLocaleString('it-IT',{maximumFractionDigits:2})}` : 'non disponibile');
  h += kpi('Media al giorno', c.giorni ? eur(c.tot / c.giorni) : '—', `${c.giorni} giorni di apertura`);
  h += '</div>';
  const isYear = p.k === 'ytd';
  h += `<div class="card"><h3>${isYear ? 'Mese per mese' : 'Giorno per giorno'}</h3><div class="sub">${isYear ? `${Y} contro ${Y-1}` : 'Per locale'}</div>`;

  const locs = ['Appio','N Antro'].filter(locOk);

  locs.forEach(l => {
    const r = c.righe.filter(x => x[1] === l), rp = cp.righe.filter(x => x[1] === l);

    h += `<tr><td>${l}</td><td class="num">${eur(t)}</td><td>${delta(t, tp)}</td><td class="num">${sc.toLocaleString('it-IT')}</td><td class="num">${sc ? '€ '+(t/sc).toFixed(2).replace('.',',') : '—'}</td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  // pagamenti
  const cont = c.contanti, car = c.carta, tot = cont + car || 1;
  h += `<div class="card"><h3>Come pagano i clienti</h3><div class="sub">Carta, contanti dichiarati e nero</div>`;
  h += `<div class="bar100"><div style="width:${car/tot*100}%;background:${css('--s1')}"></div><div style="width:${Math.max(cont - c.nero,0)/tot*100}%;background:${css('--s3')}"></div><div style="width:${Math.min(c.nero,cont)/tot*100}%;background:${css('--s2')}"></div></div>`;
  h += `<div class="rows"><div class="r"><span>Carta</span><span class="num">${eur(car)} · ${pct(car, tot)}</span></div><div class="r"><span>Contanti dichiarati</span><span class="num">${eur(Math.max(cont - c.nero,0))} · ${pct(Math.max(cont-c.nero,0), tot)}</span></div><div class="r"><span>Nero<small>campo "Altro" della chiusura</small></span><span class="num">${eur(c.nero)} · ${pct(c.nero, tot)}</span></div></div></div></div>`;
  h += `<div class="card"><h3>Media per giorno della settimana</h3><div class="sub">Incasso medio nei giorni di apertura del periodo</div><div class="chart sm"><canvas id="c-dow"></canvas></div></div></div></details>`;
  document.getElementById('t-incassi').innerHTML = h;

  if (isYear){
    const mens = (y, loc) => MESI.map((_, i) => { const k = `${y}-${String(i+1).padStart(2,'0')}`; const v = sum(D.chiusure.filter(x => x[0].startsWith(k) && (!loc || locOk(x[1]))), x => x[2]); return v || null; });
    chart('c-inc', {type:'bar', data:{labels:MESI, datasets:[barDs(String(Y), mens(Y, true), css('--s1')), barDs(String(Y-1), mens(Y-1, true), css('--s-prev'))]}, options:{scales:yEur}});
  } else {
    const giorni = []; for (let d = p.from; d <= p.to; d = addDays(d, 1)) giorni.push(d);
    const ds = ['Appio','N Antro'].filter(locOk).map((l, i) => barDs(l, giorni.map(d => { const v = sum(c.righe.filter(x => x[0] === d && x[1] === l), x => x[2]); return v || null; }), css(i ? '--s2' : '--s1')));
    if (S.locale !== 'Tutti') ds[0].backgroundColor = css(S.locale === 'N Antro' ? '--s2' : '--s1');
    chart('c-inc', {type:'bar', data:{labels:giorni.map(dLabel), datasets:ds}, options:{scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, ticks:{callback:v => eurK(v)}}}}});
  }
  const dow = GG.map((_, i) => { const r = c.righe.filter(x => (dObj(x[0]).getDay() + 6) % 7 === i); const g = new Set(r.map(x => x[0])).size; return g ? sum(r, x => x[2]) / g : null; });
  chart('c-dow', {type:'bar', data:{labels:GG, datasets:[barDs('Media', dow, css('--s1'))]}, options:{scales:yEur}});
}

/* ───────────── SPESE ───────────── */
function rSpese(){
  const p = per(), f = agFt(p), s = agSp(p);

  const nc = f.righe.filter(r => r[2] < 0);
  h += `<div class="kpis">` + kpi('Totale fatture (IVA incl.)', eur(f.tot), `imponibile ${eur(f.imp)}`) + kpi('Documenti', f.righe.length.toLocaleString('it-IT'), nc.length ? `di cui ${nc.length} note di credito` : '') + kpi('Fornitori', Object.keys(forn).length) + `</div>`;

  const top = Object.entries(forn).sort((a, b) => b[1].t - a[1].t).slice(0, 12);

       top.map(([n, v]) => `<tr><td class="l">${esc(n)}</td><td>${v.n}</td><td class="num">${eur(v.t)}</td></tr>`).join('') + `</tbody></table></div></div></div>`;
  if (p.k === 'ytd') h += `<div class="card"><h3>Fatture mese per mese</h3><div class="sub">Per data fattura</div><div class="chart sm"><canvas id="c-ftm"></canvas></div></div>`;

  h += `<h2 class="sec">Spese di cassa (modulo Google) · ${S.locale}</h2><div class="kpis">`;
  h += kpi('Totale registrato', eur(s.tot), `${s.righe.length} voci`);
  h += kpi('Con fattura', eur(s.fatt), 'già comprese nelle fatture sopra');
  h += kpi('Senza fattura (nero)', eur(s.nonfatt), `di cui dipendenti ${eur(s.neroDip)}`, s.nonfatt ? 'neg' : '');
  h += '</div>';
  const sc = {}; s.righe.forEach(r => { sc[r[3]] = sc[r[3]] || [0,0]; sc[r[3]][r[5]?0:1] += r[4]; });
  const scS = Object.entries(sc).sort((a, b) => (b[1][0]+b[1][1]) - (a[1][0]+a[1][1]));
  h += `<div class="grid2"><div class="card"><h3>Per categoria</h3>` + legend([[css('--s1'),'Con fattura'],[css('--s2'),'Senza fattura']]) + `<div class="chart" style="height:${Math.max(180, scS.length*28)}px"><canvas id="c-spc"></canvas></div></div>`;
  const md = {}; s.righe.forEach(r => { md[r[6]] = (md[r[6]]||0) + r[4]; });
  h += `<div class="card"><h3>Come sono state pagate</h3><div class="sub">Il confronto con gli estratti Amex e BCC è nella sezione "Carte aziendali"</div><div class="rows">` +
       Object.entries(md).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="r"><span>${esc(k)}</span><span class="num">${eur(v)} · ${pct(v, s.tot)}</span></div>`).join('') + `</div></div></div>`;
  const ult = [...s.righe].reverse().slice(0, 25);
  h += `<div class="card"><h3>Ultime spese inserite</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Data</th><th class="l">Locale</th><th class="l">Fornitore</th><th class="l">Categoria</th><th>Importo</th><th class="l">Fatt.</th><th class="l">Pagata con</th></tr></thead><tbody>` +
       ult.map(r => `<tr><td>${dLabel(r[0])}</td><td class="l">${esc(r[1])}</td><td class="l">${esc(r[2])}</td><td class="l">${esc(r[3])}</td><td class="num">${eur(r[4])}</td><td class="l">${r[5] ? 'Sì' : '<b>No</b>'}</td><td class="l">${esc(r[6])}</td></tr>`).join('') +
       `</tbody></table></div>${ult.length ? '' : '<div class="empty">Nessuna spesa nel periodo.</div>'}</div>`;
  document.getElementById('t-spese').innerHTML = h;

  chart('c-cat', {type:'bar', data:{labels:catS.map(x => x[0]), datasets:[barDs('Imponibile', catS.map(x => x[1]), css('--s1'))]},
        options:{indexAxis:'y', interaction:{mode:'nearest', axis:'y', intersect:false}, scales:{x:{ticks:{callback:v => eurK(v)}}, y:{grid:{display:false}}}}});
  if (p.k === 'ytd'){
    const Y = +p.to.slice(0,4);
    const fm = MESI.map((_, i) => { const k = `${Y}-${String(i+1).padStart(2,'0')}`; const v = sum(D.fatture.filter(x => x[0].startsWith(k)), x => x[2]); return v || null; });
    chart('c-ftm', {type:'bar', data:{labels:MESI, datasets:[barDs('Fatture', fm, css('--s1'))]}, options:{scales:yEur}});
  }
  chart('c-spc', {type:'bar', data:{labels:scS.map(x => x[0]), datasets:[barDs('Con fattura', scS.map(x => x[1][0]), css('--s1')), barDs('Senza fattura', scS.map(x => x[1][1]), css('--s2'))]},
        options:{indexAxis:'y', interaction:{mode:'nearest', axis:'y', intersect:false}, scales:{x:{stacked:true, ticks:{callback:v => eurK(v)}}, y:{stacked:true, grid:{display:false}}}}});
}

/* ───────────── DIPENDENTI ───────────── */
// turni: [data, pranzo|cena, nome, locale] · spese[8] = nome dipendente abbinato alla busta
function neroPersone(p, loc = true){
  const T = D.tariffe || {}, def = T['*'] || 0, out = {};
  const get = n => out[n] = out[n] || {nome:n, busta: !!(D.persone[n] || {}).busta, turni:0, pranzi:0, cene:0, reg:0, stim:0, tot:0, tariffa:0};
  D.turni.forEach(t => { if (inP(t[0], p) && (!loc || locOk(t[3]))) { const o = get(t[2]); o.turni++; t[1] === 'pranzo' ? o.pranzi++ : o.cene++; } });
  D.spese.forEach(s => { if (s[3] === 'Dipendente' && !s[5] && inP(s[0], p) && (!loc || locOk(s[1]))) get(s[8] || String(s[2]).toUpperCase()).reg += s[4]; });
  Object.values(out).forEach(o => {
    o.haTariffa = o.busta || (o.nome in T) || ('*' in T);
    o.tariffa = o.busta ? 0 : (T[o.nome] ?? def);
    o.stim = o.turni * o.tariffa;
    o.tot = Math.max(o.reg, o.stim);   // registrato nel modulo o stima da turni, il maggiore
  });
  return out;
}
function neroPers(p, loc){
  const o = Object.values(neroPersone(p, loc)), sb = o.filter(x => !x.busta && x.turni);
  return { reg:sum(o,x=>x.reg), stim:sum(o,x=>x.stim), tot:sum(o,x=>x.tot),
           sbTurni:sum(sb,x=>x.turni), sbSenzaTariffa:sb.filter(x => !x.haTariffa).sort((a,b) => b.turni-a.turni) };
}
function mesiAnno(){
  const Y = +D.meta.ultima_chiusura.slice(0,4);
  return MESI.map((_, i) => `${Y}-${String(i+1).padStart(2,'0')}`).filter(k => k >= ym(D.meta.inizio) && k <= ym(D.meta.ultima_chiusura));
}
const rangeMese = k => ({from:k+'-01', to:`${k}-${new Date(+k.slice(0,4), +k.slice(5), 0).getDate()}`});

// organico: persone diverse in servizio per giorno e locale
function organico(p){
  const srv = {};
  D.turni.forEach(t => { if (!inP(t[0], p) || !locOk(t[3])) return;
    const k = t[0] + '|' + t[3]; const o = srv[k] = srv[k] || {pers:new Set(), pranzo:0, cena:0};
    o.pers.add(t[2]); o[t[1]]++; });
  const primo = D.turni.length ? D.turni[0][0] : '9999';
  const giorni = agCh(p).righe.filter(c => c[0] >= primo).map(c => {
    const o = srv[c[0] + '|' + c[1]]; return {d:c[0], loc:c[1], inc:c[2], pers:o ? o.pers.size : 0, pranzo:o ? o.pranzo : 0, cena:o ? o.cena : 0};
  });
  return { giorni, coperti: giorni.filter(g => g.pers), mancanti: giorni.filter(g => !g.pers) };
}

function turniGriglia(tm, soloNome){
  const [ty, tmm] = tm.split('-').map(Number), nd = new Date(ty, tmm, 0).getDate();
  const tt = D.turni.filter(t => t[0].startsWith(tm) && locOk(t[3]) && (!soloNome || t[2] === soloNome));
  const dips = [...new Set(tt.map(t => t[2]))].sort();
  let h = `<div class="card"><h3>Turni ${ymLabel(tm)} · ${S.locale}</h3><div class="sub"><span class="chip p">P</span> pranzo &nbsp; <span class="chip c">C</span> cena</div><div class="turni-wrap"><table class="turni"><thead><tr><th>Persona</th>` +
          Array.from({length:nd}, (_, i) => `<th>${i+1}</th>`).join('') + `<th>Tot</th></tr></thead><tbody>`;
  dips.forEach(dp => {
    h += `<tr><td class="n">${esc(dp)}</td>`;
    for (let g = 1; g <= nd; g++){
      const d = `${tm}-${String(g).padStart(2,'0')}`, x = tt.filter(t => t[0] === d && t[2] === dp);
      h += `<td>${x.some(t => t[1] === 'pranzo') ? '<span class="chip p">P</span>' : ''}${x.some(t => t[1] === 'cena') ? '<span class="chip c">C</span>' : ''}</td>`;
    }
    h += `<td><b>${tt.filter(t => t[2] === dp).length}</b></td></tr>`;
  });
  return h + `</tbody></table></div>${dips.length ? '' : '<div class="empty">Nessun turno inserito in questo mese.</div>'}</div>`;
}

function rDipendenti(){
  const p = per(), el = document.getElementById('t-dipendenti'), after = [];
  const pers = Object.keys(D.persone).sort((a, b) => (D.persone[b].busta - D.persone[a].busta) || a.localeCompare(b));
  if (!S.dip || (S.dip !== 'Tutti' && !D.persone[S.dip])) S.dip = 'Tutti';
  let h = `<div class="filters" style="padding-top:16px"><select id="dipsel" aria-label="Persona"><option value="Tutti">Tutto il personale</option>` +
          pers.map(n => `<option value="${esc(n)}">${esc(n)}${D.persone[n].busta ? '' : ' · senza busta'}</option>`).join('') + `</select></div>`;
  h += S.dip === 'Tutti' ? dipTutti(p, after) : dipPersona(p, S.dip, after);
  el.innerHTML = h;
  const sel = document.getElementById('dipsel'); sel.value = S.dip; sel.onchange = () => { S.dip = sel.value; render(); };
  el.querySelectorAll('[data-dip]').forEach(a => a.onclick = e => { e.preventDefault(); S.dip = a.dataset.dip; render(); window.scrollTo({top:0}); });
  after.forEach(f => f());
}

function dipTutti(p, after){
  const g = agPg(p), c = agCh(p, false), np = neroPers(p, false);
  let h = `<h2 class="sec">Costo del personale · ${esc(p.label)}</h2>`;
  if (!g) h += alertBox('info', 'Dati mensili', 'Le buste paga sono mensili: scegli un mese o l\'anno per vedere il costo del personale.');
  else {
    const reale = g.netto + g.f24 + np.tot, stimaF24 = g.have.some(k => D.paghe[k].f24_stima);
    h += `<div class="kpis">` +
      kpi('Lordo in busta', eur(g.lordo), `${g.have.length} mesi di paghe`) +
      kpi('Netto in busta', eur(g.netto), 'pagato ai dipendenti') +
      kpi('F24', eur(g.f24), stimaF24 ? 'in parte stimato (mesi senza modello F24 letto)' : 'dal modello F24 delle paghe') +
      kpi('Nero personale', eur(np.tot), `registrato ${eur(np.reg)} · stimato da turni ${eur(np.stim)}`, np.tot ? 'neg' : '') +
      kpi('Costo reale', eur(reale), `${pct(reale, c.tot)} dell'incasso`) + `</div>`;
    if (g.mancanti.length) h += alertBox('warn', `Mancano le paghe di: ${g.mancanti.map(ymLabel).join(', ')}`, 'I totali sono incompleti finché le buste di questi mesi non vengono lette dalla mail.');
    h += `<p class="note" style="margin-top:8px">Non conteggiati perché non escono subito di cassa: TFR ${eur(g.tfr)}, ratei (ferie, 13ª, 14ª) ${eur(g.ratei)}, INAIL ${eur(g.inail)}.</p>`;
  }
  if (np.sbSenzaTariffa.length) h += alertBox('warn', `${sum(np.sbSenzaTariffa, x => x.turni)} turni di persone senza busta e senza tariffa`,
    `${np.sbSenzaTariffa.slice(0,10).map(x => `${esc(x.nome)} (${x.turni})`).join(', ')}. Il nero pagato a queste persone non risulta da nessuna parte: indica in config.json quanto prende ognuno a turno ("tariffe_turno_nero") e verrà stimato.`);

  // mese per mese
  const mesi = mesiAnno();
  const rows = mesi.map(k => { const q = D.paghe[k], n = neroPers(rangeMese(k), false).tot, inc = sum(D.chiusure.filter(x => x[0].startsWith(k)), x => x[2]); return {k, q, n, inc, tot:(q ? q.netto + q.f24 : 0) + n}; });
  h += `<details class="det"><summary>Costo del personale mese per mese</summary><div class="in"><div class="card"><h3>Mese per mese</h3>` + legend([[css('--s1'),'Netto busta'],[css('--s3'),'F24'],[css('--s2'),'Nero']]) + `<div class="chart"><canvas id="c-pers"></canvas></div>`;
  h += `<div class="tbl-wrap" style="margin-top:12px"><table class="t"><thead><tr><th>Mese</th><th>Lordo</th><th>Netto</th><th>F24</th><th>Nero</th><th>Costo reale</th><th>% incasso</th></tr></thead><tbody>`;
  rows.forEach(r => {
    h += `<tr><td>${MESI[+r.k.slice(5)-1]}</td>` + (r.q ? `<td class="num">${eur(r.q.lordo)}</td><td class="num">${eur(r.q.netto)}</td><td class="num">${eur(r.q.f24)}${r.q.f24_stima ? '*' : ''}</td>` :
         r.k >= ym(D.meta.ultima_chiusura) ? `<td colspan="3" style="color:var(--text-3)">in arrivo il mese prossimo</td>` : `<td colspan="3" style="color:var(--warn)">paghe mancanti</td>`) +
         `<td class="num">${eur(r.n)}</td><td class="num">${eur(r.tot)}</td><td>${pct(r.tot, r.inc)}</td></tr>`;
  });
  const tq = rows.filter(r => r.q);
  h += `<tr class="tot"><td>Totale</td><td class="num">${eur(sum(tq,r=>r.q.lordo))}</td><td class="num">${eur(sum(tq,r=>r.q.netto))}</td><td class="num">${eur(sum(tq,r=>r.q.f24))}</td><td class="num">${eur(sum(rows,r=>r.n))}</td><td class="num">${eur(sum(rows,r=>r.tot))}</td><td>${pct(sum(rows,r=>r.tot), sum(rows,r=>r.inc))}</td></tr></tbody></table></div>`;
  if (rows.some(r => r.q && r.q.f24_stima)) h += `<p class="note">* F24 stimato: il modello F24 di quel mese non è stato letto dal PDF.</p>`;
  h += `</div></div></details>`;
  after.push(() => chart('c-pers', {type:'bar', data:{labels:rows.map(r => MESI[+r.k.slice(5)-1]), datasets:[
      barDs('Netto busta', rows.map(r => r.q ? r.q.netto : null), css('--s1')),
      barDs('F24', rows.map(r => r.q ? r.q.f24 : null), css('--s3')),
      barDs('Nero', rows.map(r => r.n || null), css('--s2'))]},
    options:{scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, ticks:{callback:v => eurK(v)}}}}}));

  // persone
  const np2 = neroPersone(p), bustaDi = n => { let l = 0, nt = 0; if (g) g.have.forEach(k => D.paghe[k].dip.filter(d => d[0] === n).forEach(d => { l += d[2]; nt += d[3]; })); return {l, nt}; };
  const bonif = n => -sum((D.banca || []).filter(m => m[2] === 'Personale' && m[3] === n && inP(m[0], p)), m => m[1]);
  const lista = Object.keys(D.persone).map(n => { const o = np2[n] || {turni:0, pranzi:0, cene:0, reg:0, stim:0, tot:0, busta:D.persone[n].busta}; const b = bustaDi(n); return Object.assign({nome:n}, o, {lordo:b.l, netto:b.nt, bon:bonif(n), costo:b.nt + o.tot}); })
                  .filter(x => x.turni || x.netto || x.tot).sort((a, b) => b.turni - a.turni);
  h += `<h2 class="sec">Persone · ${esc(p.label)} · ${S.locale}</h2><div class="card"><div class="sub">Tocca un nome per il dettaglio. Bonifici = quanto ha ricevuto dal conto (stipendi, acconti, TFR): in rosso se supera il netto in busta. Il costo non include la quota F24.</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Persona</th><th class="l">Busta</th><th>Turni</th><th>Netto busta</th><th>Bonifici</th><th>Nero</th><th>Costo</th><th>€ / turno</th></tr></thead><tbody>` +
       lista.map(x => `<tr><td><a href="#" data-dip="${esc(x.nome)}" style="color:var(--accent);text-decoration:none">${esc(x.nome)}</a></td><td class="l">${x.busta ? 'Sì' : '<b style="color:var(--warn)">No</b>'}</td><td>${x.turni}</td><td class="num">${x.netto ? eur(x.netto) : '—'}</td><td class="num ${x.bon > x.netto + 50 ? 'neg' : ''}">${x.bon ? eur(x.bon) : '—'}</td><td class="num">${x.tot ? eur(x.tot) + (x.stim > x.reg ? '<small style="color:var(--text-3)"> stima</small>' : '') : '—'}</td><td class="num">${x.costo ? eur(x.costo) : '—'}</td><td class="num">${x.turni && x.costo ? eur(x.costo / x.turni) : '—'}</td></tr>`).join('') +
       `</tbody></table></div></div>`;

  // organico e produttività
  const o = organico(p), cop = o.coperti;
  const persTot = sum(cop, x => x.pers), incTot = sum(cop, x => x.inc);
  h += `<h2 class="sec">Quante persone servono · ${S.locale}</h2><div class="kpis">` +
       kpi('Persone in servizio', cop.length ? (persTot / cop.length).toLocaleString('it-IT', {maximumFractionDigits:1}) : '—', 'media al giorno') +
       kpi('Incasso per persona', persTot ? eur(incTot / persTot) : '—', 'incasso del giorno / persone in servizio') +
       kpi('Giorni con turni', `${cop.length} / ${o.giorni.length}`, 'giorni di apertura con turni inseriti', o.mancanti.length ? 'neg' : '') + `</div>`;
  if (o.mancanti.length) h += alertBox('warn', `${o.mancanti.length} giorni di apertura senza turni inseriti`, 'Ultimi: ' + o.mancanti.slice(-8).map(x => `${dLabel(x.d)} ${esc(x.loc)}`).join(', ') + '. Questi giorni sono esclusi dalle medie.');
  const dw = GG.map((nm, i) => { const r = cop.filter(x => (dObj(x.d).getDay() + 6) % 7 === i); const pp = sum(r, x => x.pers), ii = sum(r, x => x.inc); return {nm, n:r.length, pers:r.length ? pp / r.length : 0, inc:r.length ? ii / r.length : 0, ip:pp ? ii / pp : 0}; });
  h += `<details class="det"><summary>Persone e incasso per giorno della settimana</summary><div class="in"><div class="grid2"><div class="card"><h3>Per giorno della settimana</h3><div class="sub">Media dei giorni con turni inseriti</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Giorno</th><th>Giorni</th><th>Persone</th><th>Incasso medio</th><th>€ / persona</th></tr></thead><tbody>` +
       dw.map(x => `<tr><td>${x.nm}</td><td>${x.n}</td><td>${x.n ? x.pers.toFixed(1).replace('.', ',') : '—'}</td><td class="num">${x.n ? eur(x.inc) : '—'}</td><td class="num">${x.n ? eur(x.ip) : '—'}</td></tr>`).join('') + `</tbody></table></div></div>`;
  h += `<div class="card"><h3>Incasso per persona in servizio</h3><div class="sub">Media per giorno della settimana</div><div class="chart sm"><canvas id="c-ip"></canvas></div></div></div></div></details>`;
  after.push(() => chart('c-ip', {type:'bar', data:{labels:GG, datasets:[barDs('€ per persona', dw.map(x => x.n ? x.ip : null), css('--s1'))]}, options:{scales:yEur}}));
  if (p.k !== 'ytd'){
    h += `<details class="det"><summary>Giorno per giorno</summary><div class="in"><div class="tbl-wrap"><table class="t"><thead><tr><th>Data</th><th class="l">Locale</th><th>Pranzo</th><th>Cena</th><th>Persone</th><th>Incasso</th><th>€ / persona</th></tr></thead><tbody>` +
         [...o.giorni].reverse().map(x => `<tr><td>${GG[(dObj(x.d).getDay()+6)%7]} ${dLabel(x.d)}</td><td class="l">${esc(x.loc)}</td><td>${x.pranzo || ''}</td><td>${x.cena || ''}</td><td>${x.pers || '<span style="color:var(--warn)">—</span>'}</td><td class="num">${eur(x.inc)}</td><td class="num">${x.pers ? eur(x.inc / x.pers) : '—'}</td></tr>`).join('') +
         `</tbody></table></div></div></details>`;
  }
  const tm = p.mese || (D.turni.length ? ym(D.turni[D.turni.length - 1][0]) : null);
  if (tm) h += `<details class="det"><summary>Griglia turni ${ymLabel(tm)}</summary><div class="in">${turniGriglia(tm)}</div></details>`;
  return h;
}

function dipPersona(p, n, after){
  const info = D.persone[n], mesi = mesiAnno();
  const tutti = neroPersone(p)[n] || {turni:0, pranzi:0, cene:0, reg:0, stim:0, tot:0, tariffa:0};
  const g = agPg(p);
  let netto = 0, lordo = 0, quotaF24 = 0;
  if (g) g.have.forEach(k => { const q = D.paghe[k]; q.dip.filter(d => d[0] === n).forEach(d => { netto += d[3]; lordo += d[2]; if (q.lordo) quotaF24 += q.f24 * d[2] / q.lordo; }); });
  const costo = netto + quotaF24 + tutti.tot;
  // incasso nei giorni in cui ha lavorato vs media
  const lav = new Set(D.turni.filter(t => t[2] === n && inP(t[0], p) && locOk(t[3])).map(t => t[0] + '|' + t[3]));
  const locSuoi = new Set([...lav].map(x => x.split('|')[1]));
  // confronto solo con i giorni in cui i turni sono stati inseriti (altrimenti non si sa chi c'era)
  const conTurni = new Set(D.turni.map(t => t[0] + '|' + t[3]));
  const chs = agCh(p).righe.filter(c => locSuoi.has(c[1]) && conTurni.has(c[0] + '|' + c[1]));
  const suoi = chs.filter(c => lav.has(c[0] + '|' + c[1])), altri = chs.filter(c => !lav.has(c[0] + '|' + c[1]));
  const media = a => a.length ? sum(a, c => c[2]) / a.length : 0;
  let h = `<h2 class="sec">${esc(n)} · ${esc(p.label)} · ${S.locale}</h2>`;
  if (!info.busta) h += alertBox('warn', 'Senza busta paga', tutti.tariffa ? `Nero stimato a ${eur(tutti.tariffa)} a turno (da config.json).` : 'Nessuna tariffa per turno impostata in config.json: il costo di questa persona non è conteggiato.');
  h += `<div class="kpis">` +
       kpi('Turni', String(tutti.turni), `${tutti.cene} cene · ${tutti.pranzi} pranzi`) +
       kpi('Netto in busta', info.busta ? (g ? eur(netto) : '—') : '—', info.busta ? `lordo ${eur(lordo)}` : 'nessuna busta') +
       kpi('Quota F24', info.busta && g ? eur(quotaF24) : '—', 'stima proporzionale al lordo') +
       kpi('Nero', eur(tutti.tot), `registrato ${eur(tutti.reg)} · stimato ${eur(tutti.stim)}`, tutti.tot ? 'neg' : '') +
       kpi('Bonifici ricevuti', eur(-sum((D.banca || []).filter(m => m[2] === 'Personale' && m[3] === n && inP(m[0], p)), m => m[1])), 'dal conto corrente nel periodo') +
       kpi('Costo totale', eur(costo), tutti.turni ? `${eur(costo / tutti.turni)} a turno` : '') +
       kpi('Incasso medio nei suoi turni', suoi.length ? eur(media(suoi)) : '—', altri.length ? `negli altri giorni (con turni inseriti): ${eur(media(altri))} · indica se lavora nei giorni forti o deboli` : '') + `</div>`;
  h += `<div class="card"><h3>Mese per mese</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Mese</th><th>Turni</th><th>Lordo</th><th>Netto</th><th>Pagamento</th><th>Nero</th><th>€ / turno</th></tr></thead><tbody>` +
       mesi.map(k => { const q = D.paghe[k], d = q ? q.dip.find(x => x[0] === n) : null, o = neroPersone(rangeMese(k))[n] || {turni:0, tot:0};
         const c2 = (d ? d[3] : 0) + o.tot;
         return `<tr><td>${MESI[+k.slice(5)-1]}</td><td>${o.turni || '—'}</td><td class="num">${d ? eur(d[2]) : '—'}</td><td class="num">${d ? eur(d[3]) : '—'}</td><td class="l" style="font-size:11px">${d ? esc(d[4] || '') : ''}</td><td class="num">${o.tot ? eur(o.tot) : '—'}</td><td class="num">${o.turni && c2 ? eur(c2 / o.turni) : '—'}</td></tr>`; }).join('') +
       `</tbody></table></div><p class="note" style="margin-top:6px">€ / turno = (netto + nero) / turni del mese, senza quota F24.</p></div>`;
  const tm = p.mese || (D.turni.length ? ym(D.turni[D.turni.length - 1][0]) : null);
  if (tm) h += turniGriglia(tm, n);
  h += `<p style="margin-top:14px"><a href="#" data-dip="Tutti" style="color:var(--accent)">← Tutto il personale</a></p>`;
  return h;
}

/* ───────────── CASSA E BANCA ───────────── */
// banca: [data, importo(+entrata/−uscita), categoria, controparte, causale] · carte: [data, circuito, descrizione, importo, categoria]
function cassaMese(p){
  const c = agCh(p, false);
  const b = D.banca.filter(m => inP(m[0], p));
  const vers = sum(b.filter(m => m[2] === 'Versamenti contanti'), m => m[1]);
  const nexi = sum(b.filter(m => m[2] === 'Incassi POS (Nexi)'), m => m[1]);
  const s = D.spese.filter(x => inP(x[0], p));
  const spContFatt = sum(s.filter(x => x[5] && x[6] === 'Contanti'), x => x[4]);
  const cfisc = c.contanti - c.nero;
  return { cfisc, vers, spContFatt, nonVersati: cfisc - vers - spContFatt, carta: c.carta, nexi, nero: c.nero };
}
function abbinaCarte(p){
  // ogni operazione di carta cerca nel modulo spese una voce stessa carta, stesso importo (±0,05), data −3/+7 giorni
  const ops = D.carte.filter(o => inP(o[0], p) && o[3] > 0);
  const mod = D.spese.filter(s => s[6] === 'Amex' || s[6] === 'Carta BCC').map(s => ({s, usata:false}));
  return ops.map(o => {
    const m = mod.find(x => !x.usata && x.s[6] === o[1] && Math.abs(x.s[4] - o[3]) <= 0.05 &&
                            (dObj(x.s[0]) - dObj(o[0])) / 864e5 >= -3 && (dObj(x.s[0]) - dObj(o[0])) / 864e5 <= 7);
    if (m) m.usata = true;
    return {o, reg: !!m};
  });
}
/* ───────────── BILANCIO ───────────── */
function rBilancio(){
  const p = per(), B = bilancio(p, true);
  let h = `<h2 class="sec">Dichiarato e nero · ${esc(p.label)} · ${S.locale === 'Tutti' ? 'tutti i locali' : S.locale}</h2>`;
  if (!B.all) h += alertBox('info', `Vista ${esc(S.locale)}: solo il nero`, 'Fatture e buste paga sono intestate alla società e non si dividono per locale: il chiaro si vede solo su "Tutti".');
  const box = (l, v, ok) => `<div class="b ${v == null ? '' : v < 0 ? 'neg' : 'pos'}"><div class="l">${l}</div><div class="v num">${v == null ? '—' : eurS(v)}</div></div>`;
  h += `<div class="big3">` + box('Resta del dichiarato', B.g && B.all ? B.chiaro : null) + box('Resta del nero', B.nero) + box('Totale', B.g && B.all ? B.totale : null) + `</div>`;
  if (B.np.sbSenzaTariffa.length) h += alertBox('crit', 'Saldo nero non affidabile', `${sum(B.np.sbSenzaTariffa, x => x.turni)} turni lavorati da persone senza busta e senza tariffa (${B.np.sbSenzaTariffa.slice(0,6).map(x => esc(x.nome)).join(', ')}…): il loro compenso in nero non è conteggiato. Imposta "tariffe_turno_nero" in config.json.`);
  if (!B.all) {}
  else if (!B.g) h += alertBox('info', 'Personale non incluso', 'Per 7/30 giorni le paghe (mensili) non sono conteggiate: saldo chiaro e totale non sono disponibili.');
  else if (B.g.mancanti.filter(k => k < ym(D.meta.ultima_chiusura)).length) h += alertBox('warn', 'Saldo chiaro incompleto', `Mancano le paghe di ${B.g.mancanti.filter(k => k < ym(D.meta.ultima_chiusura)).map(ymLabel).join(', ')}.`);
  const r = (lbl, sub, v, cls) => `<div class="r ${cls}"><span>${lbl}${sub ? `<small>${sub}</small>` : ''}</span><span class="num">${v}</span></div>`;
  h += `<p class="note">Quanto resta di ciò che è entrato, dopo fornitori e personale. Attenzione: il dichiarato comprende anche i contanti non arrivati in banca (vedi sopra).</p>`;
  h += `<div class="grid2"><div class="card"><h3>Dichiarato</h3><div class="sub">Quello che passa dai conti ufficiali${B.all ? '' : ' — <b>solo su Tutti</b>'}</div><div class="rows">` +
       r('Incassato dichiarato', 'carta + contanti, escluso il nero', eur(B.c.fisc), 'in') +
       r('Fatture fornitori', 'per data fattura, IVA inclusa', '−' + eur(B.f.tot), 'out') +
       r('Personale in busta', 'stipendi netti + tasse e contributi (F24)', B.g ? '−' + eur(B.pers) : 'n/d', 'out') +
       r('Resta', '', B.g && B.all ? eurS(B.chiaro) : '—', 'saldo') + `</div></div>`;
  h += `<div class="card"><h3>Nero</h3><div class="sub">Quello che non passa dai conti ufficiali</div><div class="rows">` +
       r('Incassato in nero', 'campo "Altro" delle chiusure', eur(B.c.nero), 'in') +
       r('Spese senza fattura', 'modulo spese, escluso personale', '−' + eur(B.s.neroAltro), 'out') +
       r('Personale in nero', `registrato ${eur(B.np.reg)} · stimato da turni ${eur(B.np.stim)}`, '−' + eur(B.np.tot), 'out') +
       r('Resta', B.nero < 0 ? 'pagato con soldi del dichiarato' : '', eurS(B.nero), 'saldo') + `</div></div></div>`;

  // anno mese per mese
  const Y = +D.meta.ultima_chiusura.slice(0,4), mesiY = MESI.map((_, i) => `${Y}-${String(i+1).padStart(2,'0')}`).filter(k => k <= ym(D.meta.ultima_chiusura) && k >= ym(D.meta.inizio));
  const righe = mesiY.map(k => { const last = new Date(+k.slice(0,4), +k.slice(5), 0).getDate(); return [k, bilancio({from:k+'-01', to:`${k}-${last}`}, true)]; });
  let cum = 0; const cumA = righe.map(([, b]) => (cum += b.nero));
  h += `<div class="card"><h3>Nero mese per mese ${Y} · ${S.locale === 'Tutti' ? 'tutti i locali' : S.locale}</h3><div class="sub">Barre: entrato e uscito nel mese. Linea: quanto resta, accumulato da gennaio. Sotto lo zero = nero pagato con soldi del dichiarato.</div>` +
       legend([[css('--s1'),'Nero incassato'],[css('--s2'),'Nero speso (registrato)'],[css('--text'),'Resta, accumulato']]) + `<div class="chart"><canvas id="c-nero"></canvas></div></div>`;
  h += `<details class="det"><summary>Tabella mese per mese ${Y}</summary><div class="in"><div class="tbl-wrap"><table class="t"><thead><tr><th>Mese</th><th>Dichiarato</th><th>Fatture</th><th>Personale</th><th>Resta dich.</th><th>Nero entrato</th><th>Nero uscito</th><th>Resta nero</th><th>Nero accum.</th></tr></thead><tbody>`;
  righe.forEach(([k, b], i) => {
    const cl = v => v < 0 ? 'neg' : 'pos';
    h += `<tr><td>${MESI[+k.slice(5)-1]}</td><td class="num">${eur(b.c.fisc)}</td><td class="num">${eur(b.f.tot)}</td><td class="num">${b.g.have.length ? eur(b.pers) : k >= ym(D.meta.ultima_chiusura) ? '<span style="color:var(--text-3)">in arrivo</span>' : '<span style="color:var(--warn)">mancanti</span>'}</td><td class="num ${b.all ? cl(b.chiaro) : ''}">${b.all ? eurS(b.chiaro) : '—'}</td><td class="num">${eur(b.c.nero)}</td><td class="num">${eur(b.neroUscito)}</td><td class="num ${cl(b.nero)}">${eurS(b.nero)}</td><td class="num ${cl(cumA[i])}">${eurS(cumA[i])}</td></tr>`;
  });
  const T = righe.reduce((a, [, b]) => { a[0]+=b.c.fisc; a[1]+=b.f.tot; a[2]+=b.pers; a[3]+=b.chiaro || 0; a[4]+=b.c.nero; a[5]+=b.neroUscito; a[6]+=b.nero; return a; }, [0,0,0,0,0,0,0]);
  h += `<tr class="tot"><td>Totale</td>${T.slice(0,3).map(v => `<td class="num">${eur(v)}</td>`).join('')}<td class="num ${S.locale === 'Tutti' ? (T[3]<0?'neg':'pos') : ''}">${S.locale === 'Tutti' ? eurS(T[3]) : '—'}</td><td class="num">${eur(T[4])}</td><td class="num">${eur(T[5])}</td><td class="num ${T[6]<0?'neg':'pos'}">${eurS(T[6])}</td><td></td></tr></tbody></table></div></div></details>`;
  document.getElementById('t-bilancio').innerHTML = h;
  chart('c-nero', {type:'bar', data:{labels:righe.map(([k]) => MESI[+k.slice(5)-1]), datasets:[
      lineDs('Saldo accumulato', cumA, css('--text'), {order:0}),
      barDs('Nero incassato', righe.map(([, b]) => b.c.nero), css('--s1'), {order:1}),
      barDs('Nero speso', righe.map(([, b]) => b.neroUscito), css('--s2'), {order:1})]},
    options:{scales:yEur}});
}

/* ───────────── avvio e navigazione ───────────── */
const RENDER = {home:rHome, incassi:rIncassi, costi:rCosti, cassa:rCassa, dipendenti:rDipendenti};
function render(){
  CHARTS.forEach(c => c.destroy()); CHARTS = [];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 't-' + S.tab));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  document.querySelectorAll('#locale button').forEach(b => b.classList.toggle('on', b.dataset.l === S.locale));
  const p = per();
  document.getElementById('fnote').textContent = `${p.from.split('-').reverse().join('/')} → ${p.to.split('-').reverse().join('/')}`;
  try { RENDER[S.tab](); } catch(e){ document.getElementById('t-' + S.tab).innerHTML = alertBox('crit', 'Errore nella pagina', esc(e.message)); console.error(e); }
  try { sessionStorage.setItem('bonora_s', JSON.stringify(S)); } catch(e){}
}
function avvia(dati){
  D = dati;
  PERIODI = costruisciPeriodi();
  try { Object.assign(S, JSON.parse(sessionStorage.getItem('bonora_s') || '{}')); } catch(e){}
  if (!PERIODI.some(p => p.k === S.periodo)) S.periodo = 'ytd';
  if (!RENDER[S.tab]) S.tab = 'home';
  const sel = document.getElementById('periodo');
  sel.innerHTML = PERIODI.map(p => `<option value="${p.k}">${esc(p.label)}</option>`).join('');
  sel.value = S.periodo;
  sel.onchange = () => { S.periodo = sel.value; render(); };
  document.querySelectorAll('#locale button').forEach(b => b.onclick = () => { S.locale = b.dataset.l; render(); });
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); window.scrollTo({top:0}); });
  document.getElementById('agg').textContent = `Aggiornato ${D.meta.generato} · ultima chiusura ${D.meta.ultima_chiusura.split('-').reverse().join('/')}`;
  document.getElementById('foot').textContent = `Dati dal ${D.meta.inizio.split('-').reverse().join('/')} · fatture fino al ${D.meta.ultima_fattura ? D.meta.ultima_fattura.split('-').reverse().join('/') : '—'} · spese fino al ${D.meta.ultima_spesa ? D.meta.ultima_spesa.split('-').reverse().join('/') : '—'}`;
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', render);
  render();
}
</script>
