<style>
:root{
  color-scheme:light;
  --bg:#f5f4f0; --surface:#ffffff; --surface-2:#f0efec; --border:#dddbd2; --border-soft:#ebe9e2;
  --text:#1f1e1c; --text-2:#52514e; --text-3:#85847d;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s-prev:#b9b7ae;
  --good:#0c7a0c; --good-bg:#e6f3e6; --crit:#c03030; --crit-bg:#fbe9e9; --warn:#9a6400; --warn-bg:#fdf3dc;
  --accent:#2a78d6;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#383835; --border-soft:#2a2a28;
    --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s-prev:#5a5955;
    --good:#4cc24c; --good-bg:#16301a; --crit:#ef7070; --crit-bg:#3a1c1c; --warn:#f0b43c; --warn-bg:#3a2e14;
    --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#121211; --surface:#1a1a19; --surface-2:#242422; --border:#383835; --border-soft:#2a2a28;
  --text:#f0efec; --text-2:#c3c2b7; --text-3:#8f8e86;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s-prev:#5a5955;
  --good:#4cc24c; --good-bg:#16301a; --crit:#ef7070; --crit-bg:#3a1c1c; --warn:#f0b43c; --warn-bg:#3a2e14;
  --accent:#3987e5;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px;line-height:1.45}
body{min-height:100vh}
button,select,input{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* blocco password */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.lock-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px 24px;width:100%;max-width:360px}
.lock-box h1{font-size:20px;font-weight:500;margin-bottom:4px}
.lock-box p{color:var(--text-3);font-size:13px;margin-bottom:18px}
.lock-box input[type=password]{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface-2);font-size:16px;margin-bottom:10px}
.lock-box label{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--text-2);margin-bottom:16px}
.lock-box button{width:100%;padding:11px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.lock-err{color:var(--crit);font-size:13px;min-height:18px;margin-top:10px}

/* layout */
#app{display:none;max-width:1180px;margin:0 auto;padding:0 16px 40px}
header.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 0 10px;flex-wrap:wrap}
header.top h1{font-size:20px;font-weight:500}
header.top .agg{font-size:12px;color:var(--text-3)}
.lockbtn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;color:var(--text-2);cursor:pointer;margin-left:8px}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding:6px 0;border-bottom:1px solid var(--border);scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:0 0 auto;background:none;border:0;border-radius:8px;padding:8px 14px;color:var(--text-2);cursor:pointer;font-weight:500}
nav.tabs button.on{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--border)}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px 0 4px}
.filters select{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);max-width:100%}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;cursor:pointer;color:var(--text-2)}
.seg button.on{background:var(--surface-2);color:var(--text);font-weight:600}
.note{font-size:12px;color:var(--text-3)}
section.tab{display:none}
section.tab.on{display:block}
h2.sec{font-size:12px;font-weight:600;color:var(--text-3);text-transform:uppercase;letter-spacing:.07em;margin:26px 0 10px;padding-bottom:7px;border-bottom:1px solid var(--border)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 15px}
.kpi .l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.kpi .v{font-size:22px;font-weight:600}
.kpi .s{font-size:12px;color:var(--text-2);margin-top:3px}
.kpi.neg .v{color:var(--crit)} .kpi.pos .v{color:var(--good)}
.up{color:var(--good)} .down{color:var(--crit)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-top:12px}
.card h3{font-size:13px;font-weight:600;margin-bottom:2px}
.card .sub{font-size:12px;color:var(--text-3);margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>.card{margin-top:12px}
@media(max-width:760px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:19px}}
.chart{position:relative;height:260px}
.chart.sm{height:210px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--text-2);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tbl-wrap{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:right;font-weight:500;color:var(--text-3);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
table.t td{text-align:right;padding:7px 8px;border-bottom:1px solid var(--border-soft)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td.l,table.t th.l{text-align:left}
table.t tr.tot td{font-weight:600;background:var(--surface-2)}
table.t td.neg{color:var(--crit);font-weight:600} table.t td.pos{color:var(--good);font-weight:600}
.alert{display:flex;gap:10px;align-items:flex-start;border-radius:10px;padding:11px 13px;margin-top:8px;font-size:13px}
.alert b{display:block;margin-bottom:1px}
.alert .ico{font-weight:700;flex:0 0 auto;width:20px;text-align:center}
.alert.crit{background:var(--crit-bg);color:var(--text)} .alert.crit .ico,.alert.crit b{color:var(--crit)}
.alert.warn{background:var(--warn-bg);color:var(--text)} .alert.warn .ico,.alert.warn b{color:var(--warn)}
.alert.ok{background:var(--good-bg)} .alert.ok .ico,.alert.ok b{color:var(--good)}
.alert.info{background:var(--surface-2)} .alert.info .ico{color:var(--text-2)}
.rows .r{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--border-soft);font-size:13px}
.rows .r:last-child{border-bottom:0}
.rows .r small{display:block;color:var(--text-3);font-size:11px}
.rows .r.in .num{color:var(--good)} .rows .r.out .num{color:var(--crit)}
.rows .r.saldo{border-top:1px solid var(--border);margin-top:4px;padding-top:10px;font-weight:600;font-size:15px}
.big3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:600px){.big3{grid-template-columns:1fr}}
.big3 .b{border-radius:10px;padding:14px;text-align:center;background:var(--surface);border:1px solid var(--border)}
.big3 .b .l{font-size:11px;color:var(--text-3);text-transform:uppercase;letter-spacing:.05em}
.big3 .b .v{font-size:24px;font-weight:700;margin-top:4px}
.big3 .b.neg{background:var(--crit-bg);border-color:transparent} .big3 .b.neg .v{color:var(--crit)}
.big3 .b.pos{background:var(--good-bg);border-color:transparent} .big3 .b.pos .v{color:var(--good)}
.bar100{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;margin:8px 0}
.turni-wrap{overflow-x:auto}
table.turni{border-collapse:collapse;font-size:11px}
table.turni th,table.turni td{border:1px solid var(--border-soft);padding:3px 4px;text-align:center;min-width:26px}
table.turni th{background:var(--surface-2);color:var(--text-3);font-weight:500}
table.turni td.n{text-align:left;white-space:nowrap;font-weight:500;padding:3px 8px;position:sticky;left:0;background:var(--surface)}
.chip{display:inline-block;border-radius:3px;padding:0 3px;font-size:10px;font-weight:600;color:#fff}
.chip.p{background:var(--s1)} .chip.c{background:var(--s2)}
.empty{color:var(--text-3);font-size:13px;padding:12px 0}
footer{margin-top:30px;font-size:11px;color:var(--text-3);text-align:center}
</style>
</head>
<body>

<div id="lock">
  <form class="lock-box" id="lockform" autocomplete="on">
    <h1>La Bonora</h1>
    <p>Dashboard riservata. Inserisci la password.</p>
    <input type="text" name="username" value="bonora" autocomplete="username" style="display:none">
    <input type="password" id="pw" autocomplete="current-password" placeholder="Password" required>
    <label><input type="checkbox" id="remember" checked> Ricorda su questo dispositivo</label>
    <button type="submit" id="unlockbtn">Apri</button>
    <div class="lock-err" id="lockerr"></div>
  </form>
</div>

<div id="app">
  <header class="top">
    <h1>La Bonora</h1>
    <div class="agg"><span id="agg"></span><button class="lockbtn" id="logout" type="button">Esci</button></div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-t="riepilogo" class="on">Riepilogo</button>
    <button data-t="incassi">Incassi</button>
    <button data-t="spese">Spese</button>
    <button data-t="dipendenti">Dipendenti</button>
    <button data-t="bilancio">Bilancio</button>
  </nav>
  <div class="filters">
    <select id="periodo" aria-label="Periodo"></select>
    <div class="seg" id="locale" role="group" aria-label="Locale">
      <button data-l="Tutti" class="on">Tutti</button><button data-l="Appio">Appio</button><button data-l="N Antro">N Antro</button>
    </div>
    <span class="note" id="fnote"></span>
  </div>
  <section class="tab on" id="t-riepilogo"></section>
  <section class="tab" id="t-incassi"></section>
  <section class="tab" id="t-spese"></section>
  <section class="tab" id="t-dipendenti"></section>
  <section class="tab" id="t-bilancio"></section>
  <footer id="foot"></footer>
</div>

const ITER = 250000;
const LS_KEY = 'bonora_pw';

/* ───────────── sblocco ───────────── */
async function decifra(pw){
  const raw = Uint8Array.from(atob(ENC), c => c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:ITER, hash:'SHA-256'}, km,
                                            {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return JSON.parse(new TextDecoder().decode(pt));
}
function lsGet(){ try{ return localStorage.getItem(LS_KEY); }catch(e){ return null; } }
function lsSet(v){ try{ v ? localStorage.setItem(LS_KEY, v) : localStorage.removeItem(LS_KEY); }catch(e){} }

async function sblocca(pw, ricorda){
  const err = document.getElementById('lockerr');
  const btn = document.getElementById('unlockbtn');
  btn.disabled = true; btn.textContent = 'Apertura…'; err.textContent = '';
  try{
    const D = await decifra(pw);
    if (ricorda) lsSet(pw);
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    avvia(D);
  }catch(e){
    lsSet(null);
    err.textContent = (window.crypto && crypto.subtle) ? 'Password errata.' : 'Browser non supportato: apri la pagina da https.';
  }finally{ btn.disabled = false; btn.textContent = 'Apri'; }
}
document.getElementById('lockform').addEventListener('submit', e => {
  e.preventDefault();
  sblocca(document.getElementById('pw').value, document.getElementById('remember').checked);
});
document.getElementById('logout').addEventListener('click', () => { lsSet(null); location.reload(); });
(function(){ const s = lsGet(); if (s) sblocca(s, true); })();

/* ───────────── utilità ───────────── */
const MESI = ['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];
const MESI_L = ['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const GG = ['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const eur = v => (v < 0 ? '−' : '') + '€ ' + Math.round(Math.abs(v)).toLocaleString('it-IT');
const eurS = v => (v > 0 ? '+' : v < 0 ? '−' : '') + '€ ' + Math.round(Math.abs(v)).toLocaleString('it-IT');
const eurK = v => Math.abs(v) >= 1000 ? '€' + (v/1000).toLocaleString('it-IT',{maximumFractionDigits:0}) + 'k' : '€' + Math.round(v);
const pct = (a, b) => b ? (a/b*100).toLocaleString('it-IT',{maximumFractionDigits:1}) + '%' : '—';
const delta = (a, b) => { if (!b) return ''; const d = (a/b - 1)*100; return `<span class="${d>=0?'up':'down'}">${d>=0?'▲':'▼'} ${Math.abs(d).toLocaleString('it-IT',{maximumFractionDigits:1})}%</span>`; };
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sum = (a, f) => a.reduce((s, x) => s + (f ? f(x) : x), 0);
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const ym = d => d.slice(0,7);
const dObj = s => new Date(s + 'T12:00:00');
const dIso = d => d.toISOString().slice(0,10);
const addDays = (s, n) => { const d = dObj(s); d.setDate(d.getDate() + n); return dIso(d); };
const ymLabel = k => MESI_L[+k.slice(5,7)-1] + ' ' + k.slice(0,4);
const dLabel = s => s.slice(8,10) + '/' + s.slice(5,7);
function kpi(l, v, s, cls){ return `<div class="kpi ${cls||''}"><div class="l">${l}</div><div class="v num">${v}</div>${s?`<div class="s">${s}</div>`:''}</div>`; }
function alertBox(tipo, titolo, testo){ const ico = {crit:'!', warn:'!', ok:'✓', info:'i'}[tipo]; return `<div class="alert ${tipo}"><span class="ico">${ico}</span><div><b>${titolo}</b>${testo||''}</div></div>`; }
function legend(items){ return '<div class="legend">' + items.map(([c,t]) => `<span><i style="background:${c}"></i>${t}</span>`).join('') + '</div>'; }

let D, S = {tab:'riepilogo', periodo:'ytd', locale:'Tutti'}, CHARTS = [];

/* ───────────── periodi ───────────── */
function costruisciPeriodi(){
  const ultima = D.meta.ultima_chiusura, Y = +ultima.slice(0,4), inizio = D.meta.inizio;
  const P = [{k:'ytd', label:`Anno ${Y} (dal 1/1)`, from: inizio, to: ultima}];
  for (let m = +ultima.slice(5,7); m >= 1; m--){
    const k = `${Y}-${String(m).padStart(2,'0')}`;
    const last = new Date(Y, m, 0).getDate();
    P.push({k:'m:'+k, label: ymLabel(k) + (k === ym(ultima) ? ' (in corso)' : ''), from: k+'-01', to: (k === ym(ultima) ? ultima : `${k}-${last}`), mese:k});
  }
  P.push({k:'30g', label:'Ultimi 30 giorni', from: addDays(ultima,-29), to: ultima, breve:true});
  P.push({k:'7g',  label:'Ultimi 7 giorni',  from: addDays(ultima,-6),  to: ultima, breve:true});
  return P;
}
let PERIODI = [];
function per(){ return PERIODI.find(p => p.k === S.periodo) || PERIODI[0]; }
function prevYear(s){ return (+s.slice(0,4) - 1) + s.slice(4); }
function mesiDi(p){ const out = []; let k = ym(p.from); while (k <= ym(p.to)){ out.push(k); let y=+k.slice(0,4), m=+k.slice(5,7)+1; if (m>12){m=1;y++;} k = `${y}-${String(m).padStart(2,'0')}`; } return out; }
const inP = (d, p) => d >= p.from && d <= p.to;
const locOk = l => S.locale === 'Tutti' || l === S.locale;

/* ───────────── aggregati ───────────── */
// chiusure: [data, locale, tot, contanti, carta, altro, scontrini, diff]
function agCh(p, loc = true){
  const r = D.chiusure.filter(c => inP(c[0], p) && (!loc || locOk(c[1])));
  return { righe:r, tot:sum(r,c=>c[2]), contanti:sum(r,c=>c[3]), carta:sum(r,c=>c[4]), nero:sum(r,c=>c[5]),
           fisc:sum(r,c=>c[4]+c[3]-c[5]), scontrini:sum(r,c=>c[6]), giorni:new Set(r.map(c=>c[0])).size };
}
function agChPrev(p, loc = true){ return agCh({from:prevYear(p.from), to:prevYear(p.to)}, loc); }
// spese: [data, locale, fornitore, categoria, importo, fatt, modalita, nft]
function agSp(p, loc = true){
  const r = D.spese.filter(s => inP(s[0], p) && (!loc || locOk(s[1])));
  const nf = r.filter(s => !s[5]);
  return { righe:r, tot:sum(r,s=>s[4]), fatt:sum(r.filter(s=>s[5]),s=>s[4]), nonfatt:sum(nf,s=>s[4]),
           neroDip:sum(nf.filter(s=>s[3]==='Dipendente'),s=>s[4]), neroAltro:sum(nf.filter(s=>s[3]!=='Dipendente'),s=>s[4]) };
}
// fatture: [data, fornitore, totale, imponibile, cat, tipo]
function agFt(p){ const r = D.fatture.filter(f => inP(f[0], p)); return { righe:r, tot:sum(r,f=>f[2]), imp:sum(r,f=>f[3]) }; }
// paghe: solo per mesi interi (non per 7/30 giorni)
function agPg(p){
  if (p.breve) return null;
  const mesi = mesiDi(p), have = mesi.filter(k => D.paghe[k]);
  const g = k => D.paghe[k];
  return { mesi, have, mancanti: mesi.filter(k => !D.paghe[k] && k < ym(D.meta.ultima_chiusura)),
           lordo:sum(have,k=>g(k).lordo), netto:sum(have,k=>g(k).netto), f24:sum(have,k=>g(k).f24),
           tfr:sum(have,k=>g(k).tfr), inail:sum(have,k=>g(k).inail), ratei:sum(have,k=>g(k).ratei) };
}
function bilancio(p, perLocale){
  // il nero si divide per locale; il chiaro (fatture, paghe) solo sul totale
  const all = !perLocale || S.locale === 'Tutti';
  const c = agCh(p, !!perLocale), f = agFt(p), s = agSp(p, !!perLocale), g = agPg(p);
  const pers = g ? g.netto + g.f24 : 0;
  const chiaro = all ? c.fisc - f.tot - pers : null, nero = c.nero - s.nonfatt;
  return { c, f, s, g, pers, chiaro, nero, all, totale: all ? chiaro + nero : null };
}

/* ───────────── grafici ───────────── */
function chart(id, cfg){
  const el = document.getElementById(id); if (!el || !window.Chart) return;
  const grid = css('--border-soft'), tick = css('--text-3');
  cfg.options = Object.assign({responsive:true, maintainAspectRatio:false, animation:false,
    interaction:{mode:'index', intersect:false},
    plugins:{legend:{display:false}, tooltip:{callbacks:{label:c => ` ${c.dataset.label}: ${eur(c.raw ?? 0)}`}}}}, cfg.options || {});
  const sc = cfg.options.scales || {};
  for (const ax of Object.values(sc)){
    ax.grid = Object.assign({color:grid, drawTicks:false}, ax.grid||{});
    ax.ticks = Object.assign({color:tick, font:{size:11}}, ax.ticks||{});
    ax.border = {display:false};
  }
  CHARTS.push(new Chart(el, cfg));
}
const barDs = (label, data, color, extra) => Object.assign({label, data, backgroundColor:color, borderRadius:4, borderSkipped:'start', maxBarThickness:28, borderColor:css('--surface'), borderWidth:{top:0,bottom:0,left:0,right:0}}, extra||{});
const lineDs = (label, data, color, extra) => Object.assign({type:'line', label, data, borderColor:color, backgroundColor:color, borderWidth:2, pointRadius:3, pointHoverRadius:5, tension:.25, spanGaps:true}, extra||{});
const yEur = {y:{ticks:{callback:v => eurK(v)}}, x:{grid:{display:false}}};

/* ───────────── RIEPILOGO ───────────── */
function rRiepilogo(){
  const p = per(), B = bilancio(p, true), cp = agChPrev(p);
  const pers = B.pers + B.s.neroDip;
  let h = `<h2 class="sec">${esc(p.label)} · ${S.locale === 'Tutti' ? 'tutti i locali' : S.locale}</h2><div class="kpis">`;
  h += kpi('Incasso', eur(B.c.tot), `${delta(B.c.tot, cp.tot)} vs ${prevYear(p.from).slice(0,4)}`);
  h += kpi('Fatture fornitori', eur(B.f.tot), B.all ? pct(B.f.tot, B.c.tot) + ' dell\'incasso' : 'totale società, non divisibile');
  h += kpi('Personale (busta + nero)', B.g && B.all ? eur(pers) : '—', !B.all ? 'solo su Tutti: le buste paga non si dividono' : B.g ? pct(pers, B.c.tot) + ' dell\'incasso' : 'n/d per 7/30 giorni');
  h += kpi('Saldo chiaro', B.g && B.all ? eurS(B.chiaro) : '—', B.all ? 'incasso fisc. − fatture − buste paga' : 'solo su Tutti', B.g && B.all ? (B.chiaro<0?'neg':'pos') : '');
  h += kpi('Saldo nero', eurS(B.nero), 'nero incassato − nero speso', B.nero<0?'neg':'pos');
  h += '</div>';
  h += `<h2 class="sec">Avvisi</h2>` + avvisi(p, B);
  h += `<div class="card"><h3>Incasso mese per mese</h3><div class="sub">${S.locale === 'Tutti' ? 'Tutti i locali' : S.locale}, ${D.meta.ultima_chiusura.slice(0,4)} contro l'anno prima</div>`;
  h += legend([[css('--s1'), D.meta.ultima_chiusura.slice(0,4)], [css('--s-prev'), +D.meta.ultima_chiusura.slice(0,4)-1]]);
  h += `<div class="chart sm"><canvas id="c-rie"></canvas></div></div>`;
  document.getElementById('t-riepilogo').innerHTML = h;
  const Y = +D.meta.ultima_chiusura.slice(0,4);
  const mens = y => MESI.map((_, i) => { const k = `${y}-${String(i+1).padStart(2,'0')}`; const v = sum(D.chiusure.filter(c => c[0].startsWith(k) && locOk(c[1])), c => c[2]); return v || null; });
  chart('c-rie', {type:'bar', data:{labels:MESI, datasets:[barDs(String(Y), mens(Y), css('--s1')), barDs(String(Y-1), mens(Y-1), css('--s-prev'))]}, options:{scales:yEur}});
}

function avvisi(p, B){
  const out = [];
  if (B.nero < 0) out.push(alertBox('crit', `Nero speso superiore al nero incassato: ${eur(-B.nero)}`,
     `Nel periodo sono usciti ${eur(B.s.nonfatt)} in nero (di cui ${eur(B.s.neroDip)} dipendenti) a fronte di ${eur(B.c.nero)} incassati non fiscalizzati. La differenza è stata pagata con soldi del chiaro.`));
  else if (B.c.nero > 0) out.push(alertBox('ok', 'Nero in equilibrio', `Incassati ${eur(B.c.nero)}, spesi ${eur(B.s.nonfatt)}: avanzo ${eur(B.nero)}.`));
  if (B.g && B.g.mancanti.length){
    const ult = D.meta.ultima_chiusura, mc = ym(ult);
    const attesi = B.g.mancanti.filter(k => k < mc);
    if (attesi.length) out.push(alertBox('warn', `Buste paga mancanti: ${attesi.map(ymLabel).join(', ')}`,
       'Il costo del personale e il saldo chiaro di questi mesi sono incompleti. Controllare la casella risorseumane@.'));
  }
  const diff = B.c.righe.filter(c => Math.abs(c[7]) >= 1);
  if (diff.length) out.push(alertBox('warn', `${diff.length} chiusure non quadrano (finanziario ≠ pagamenti)`,
     diff.slice(-6).map(c => `${dLabel(c[0])} ${esc(c[1])}: ${eurS(c[7])}`).join(' · ')));
  const strani = B.c.righe.filter(c => c[5] > c[3] + 1);
  if (strani.length) out.push(alertBox('warn', `${strani.length} giorni con non fiscalizzato maggiore dei contanti`,
     'Il nero non può superare i contanti incassati: probabilmente nel campo "Altro" sono finite anche fatture emesse. Giorni: ' + strani.slice(-6).map(c => `${dLabel(c[0])} ${esc(c[1])}`).join(', ')));
  const vis = {}, dup = [];
  B.s.righe.forEach(s => { const k = s[0]+'|'+s[2].toUpperCase()+'|'+s[4]; if (vis[k]) dup.push(s); vis[k] = 1; });
  if (dup.length) out.push(alertBox('warn', `${dup.length} spese forse inserite due volte nel modulo`,
     dup.slice(0,6).map(s => `${dLabel(s[0])} ${esc(s[2])} ${eur(s[4])}`).join(' · ')));
  const senzaN = B.s.righe.filter(s => s[5] && !String(s[7]||'').trim());
  if (senzaN.length) out.push(alertBox('info', `${senzaN.length} spese segnate "fatturate" senza numero fattura`, 'Non si possono abbinare alla fattura elettronica.'));
  const gen = D.meta.generato.slice(6,10)+'-'+D.meta.generato.slice(3,5)+'-'+D.meta.generato.slice(0,2);
  const giorniDa = s => s ? Math.round((dObj(gen) - dObj(s)) / 864e5) : 999;
  if (giorniDa(D.meta.ultima_chiusura) > 2) out.push(alertBox('warn', 'Chiusure di cassa ferme', `Ultima chiusura: ${dLabel(D.meta.ultima_chiusura)}.`));
  if (giorniDa(D.meta.ultima_spesa) > 7) out.push(alertBox('info', 'Modulo spese fermo', `Ultima spesa inserita: ${D.meta.ultima_spesa ? dLabel(D.meta.ultima_spesa) : 'nessuna'}.`));
  if (giorniDa(D.meta.ultima_fattura) > 10) out.push(alertBox('info', 'Fatture non aggiornate', `Ultima fattura: ${D.meta.ultima_fattura ? dLabel(D.meta.ultima_fattura) : 'nessuna'}. Scaricare gli XML nella cartella fatture.`));
  (D.avvisi_sistema || []).forEach(a => out.push(alertBox('info', `Aggiornamento: ${esc(a.fonte)}`, esc(a.testo))));
  return out.join('') || alertBox('ok', 'Nessun avviso', '');
}

/* ───────────── INCASSI ───────────── */
function rIncassi(){
  const p = per(), c = agCh(p), cp = agChPrev(p), Y = +p.to.slice(0,4);
  const pxR = D.pax.filter(x => inP(x[0], p)), pax = sum(pxR, x => x[1]);
  const appio = (S.locale === 'N Antro') ? null : agCh(p, false).righe.filter(r => r[1] === 'Appio' && pxR.some(x => x[0] === r[0]));
  const totAppioPax = appio ? sum(appio, r => r[2]) : 0;
  let h = `<h2 class="sec">${esc(p.label)} · ${S.locale}</h2><div class="kpis">`;
  h += kpi('Incasso', eur(c.tot), `${delta(c.tot, cp.tot)} vs ${Y-1} (${eur(cp.tot)})`);
  h += kpi('Scontrini', c.scontrini.toLocaleString('it-IT'), `${delta(c.scontrini, cp.scontrini)} vs ${Y-1}`);
  h += kpi('Scontrino medio', c.scontrini ? '€ ' + (c.tot/c.scontrini).toLocaleString('it-IT',{maximumFractionDigits:2}) : '—', cp.scontrini ? `${Y-1}: € ${(cp.tot/cp.scontrini).toLocaleString('it-IT',{maximumFractionDigits:2})}` : '');
  h += kpi('PAX (solo Appio)', S.locale === 'N Antro' ? '—' : pax.toLocaleString('it-IT'), pax ? `spesa media a persona € ${(totAppioPax/pax).toLocaleString('it-IT',{maximumFractionDigits:2})}` : 'non disponibile');
  h += kpi('Media al giorno', c.giorni ? eur(c.tot / c.giorni) : '—', `${c.giorni} giorni di apertura`);
  h += '</div>';
  const isYear = p.k === 'ytd';
  h += `<div class="card"><h3>${isYear ? 'Mese per mese' : 'Giorno per giorno'}</h3><div class="sub">${isYear ? `${Y} contro ${Y-1}` : 'Per locale'}</div>`;
  h += isYear ? legend([[css('--s1'), Y], [css('--s-prev'), Y-1]]) : legend([[css('--s1'),'Appio'],[css('--s2'),'N Antro']]);
  h += `<div class="chart"><canvas id="c-inc"></canvas></div></div>`;
  // per locale
  const locs = ['Appio','N Antro'].filter(locOk);
  h += `<div class="grid2"><div class="card"><h3>Per locale</h3><div class="sub">Confronto con lo stesso periodo ${Y-1}</div><div class="tbl-wrap"><table class="t"><thead><tr><th>Locale</th><th>Incasso</th><th>Δ ${Y-1}</th><th>Scontrini</th><th>Medio</th></tr></thead><tbody>`;
  locs.forEach(l => {
    const r = c.righe.filter(x => x[1] === l), rp = cp.righe.filter(x => x[1] === l);
    const t = sum(r, x => x[2]), tp = sum(rp, x => x[2]), sc = sum(r, x => x[6]);
    h += `<tr><td>${l}</td><td class="num">${eur(t)}</td><td>${delta(t, tp)}</td><td class="num">${sc.toLocaleString('it-IT')}</td><td class="num">${sc ? '€ '+(t/sc).toFixed(2).replace('.',',') : '—'}</td></tr>`;
  });
  h += `</tbody></table></div></div>`;
  // pagamenti
  const cont = c.contanti, car = c.carta, tot = cont + car || 1;
  h += `<div class="card"><h3>Come pagano i clienti</h3><div class="sub">Contanti, carta e quota non fiscalizzata</div>`;
  h += `<div class="bar100"><div style="width:${car/tot*100}%;background:${css('--s1')}"></div><div style="width:${Math.max(cont - c.nero,0)/tot*100}%;background:${css('--s3')}"></div><div style="width:${Math.min(c.nero,cont)/tot*100}%;background:${css('--s2')}"></div></div>`;
  h += `<div class="rows"><div class="r"><span>Carta</span><span class="num">${eur(car)} · ${pct(car, tot)}</span></div><div class="r"><span>Contanti fiscalizzati</span><span class="num">${eur(Math.max(cont - c.nero,0))} · ${pct(Math.max(cont-c.nero,0), tot)}</span></div><div class="r"><span>Non fiscalizzato (nero)<small>campo "Altro" della chiusura</small></span><span class="num">${eur(c.nero)} · ${pct(c.nero, tot)}</span></div></div></div></div>`;
  h += `<div class="card"><h3>Media per giorno della settimana</h3><div class="sub">Incasso medio nei giorni di apertura del periodo</div><div class="chart sm"><canvas id="c-dow"></canvas></div></div>`;
  document.getElementById('t-incassi').innerHTML = h;

  if (isYear){
    const mens = (y, loc) => MESI.map((_, i) => { const k = `${y}-${String(i+1).padStart(2,'0')}`; const v = sum(D.chiusure.filter(x => x[0].startsWith(k) && (!loc || locOk(x[1]))), x => x[2]); return v || null; });
    chart('c-inc', {type:'bar', data:{labels:MESI, datasets:[barDs(String(Y), mens(Y, true), css('--s1')), barDs(String(Y-1), mens(Y-1, true), css('--s-prev'))]}, options:{scales:yEur}});
  } else {
    const giorni = []; for (let d = p.from; d <= p.to; d = addDays(d, 1)) giorni.push(d);
    const ds = ['Appio','N Antro'].filter(locOk).map((l, i) => barDs(l, giorni.map(d => { const v = sum(c.righe.filter(x => x[0] === d && x[1] === l), x => x[2]); return v || null; }), css(i ? '--s2' : '--s1')));
    if (S.locale !== 'Tutti') ds[0].backgroundColor = css(S.locale === 'N Antro' ? '--s2' : '--s1');
    chart('c-inc', {type:'bar', data:{labels:giorni.map(dLabel), datasets:ds}, options:{scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, ticks:{callback:v => eurK(v)}}}}});
  }
  const dow = GG.map((_, i) => { const r = c.righe.filter(x => (dObj(x[0]).getDay() + 6) % 7 === i); const g = new Set(r.map(x => x[0])).size; return g ? sum(r, x => x[2]) / g : null; });
  chart('c-dow', {type:'bar', data:{labels:GG, datasets:[barDs('Media', dow, css('--s1'))]}, options:{scales:yEur}});
}

/* ───────────── SPESE ───────────── */
function rSpese(){
  const p = per(), f = agFt(p), s = agSp(p);
  let h = `<h2 class="sec">Fatture fornitori · ${esc(p.label)}</h2>`;
  if (S.locale !== 'Tutti') h += `<p class="note">Le fatture arrivano intestate alla società: non si possono dividere per locale, qui sono sempre il totale.</p>`;

  h += `<div class="kpis">` + kpi('Totale fatture (IVA incl.)', eur(f.tot), `imponibile ${eur(f.imp)}`) + kpi('Documenti', f.righe.length.toLocaleString('it-IT'), nc.length ? `di cui ${nc.length} note di credito` : '') + kpi('Fornitori', Object.keys(forn).length) + `</div>`;

  h += `<div class="grid2"><div class="card"><h3>Per categoria</h3><div class="sub">Imponibile delle righe fattura</div><div class="chart" style="height:${Math.max(200, catS.length*26)}px"><canvas id="c-cat"></canvas></div></div>`;
  const top = Object.entries(forn).sort((a, b) => b[1].t - a[1].t).slice(0, 12);

       top.map(([n, v]) => `<tr><td class="l">${esc(n)}</td><td>${v.n}</td><td class="num">${eur(v.t)}</td></tr>`).join('') + `</tbody></table></div></div></div>`;
  if (p.k === 'ytd') h += `<div class="card"><h3>Fatture mese per mese</h3><div class="sub">Per data fattura</div><div class="chart sm"><canvas id="c-ftm"></canvas></div></div>`;

  h += `<h2 class="sec">Spese di cassa (modulo Google) · ${S.locale}</h2><div class="kpis">`;
  h += kpi('Totale registrato', eur(s.tot), `${s.righe.length} voci`);
  h += kpi('Con fattura', eur(s.fatt), 'già comprese nelle fatture sopra');
  h += kpi('Senza fattura (nero)', eur(s.nonfatt), `di cui dipendenti ${eur(s.neroDip)}`, s.nonfatt ? 'neg' : '');
  h += '</div>';
  const sc = {}; s.righe.forEach(r => { sc[r[3]] = sc[r[3]] || [0,0]; sc[r[3]][r[5]?0:1] += r[4]; });
  const scS = Object.entries(sc).sort((a, b) => (b[1][0]+b[1][1]) - (a[1][0]+a[1][1]));
  h += `<div class="grid2"><div class="card"><h3>Per categoria</h3>` + legend([[css('--s1'),'Con fattura'],[css('--s2'),'Senza fattura']]) + `<div class="chart" style="height:${Math.max(180, scS.length*28)}px"><canvas id="c-spc"></canvas></div></div>`;
  const md = {}; s.righe.forEach(r => { md[r[6]] = (md[r[6]]||0) + r[4]; });
  h += `<div class="card"><h3>Come sono state pagate</h3><div class="sub">Le voci Amex e Carta BCC verranno confrontate con gli estratti conto (fase 3)</div><div class="rows">` +
       Object.entries(md).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<div class="r"><span>${esc(k)}</span><span class="num">${eur(v)} · ${pct(v, s.tot)}</span></div>`).join('') + `</div></div></div>`;
  const ult = [...s.righe].reverse().slice(0, 25);
  h += `<div class="card"><h3>Ultime spese inserite</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Data</th><th class="l">Locale</th><th class="l">Fornitore</th><th class="l">Categoria</th><th>Importo</th><th class="l">Fatt.</th><th class="l">Pagata con</th></tr></thead><tbody>` +
       ult.map(r => `<tr><td>${dLabel(r[0])}</td><td class="l">${esc(r[1])}</td><td class="l">${esc(r[2])}</td><td class="l">${esc(r[3])}</td><td class="num">${eur(r[4])}</td><td class="l">${r[5] ? 'Sì' : '<b>No</b>'}</td><td class="l">${esc(r[6])}</td></tr>`).join('') +
       `</tbody></table></div>${ult.length ? '' : '<div class="empty">Nessuna spesa nel periodo.</div>'}</div>`;
  document.getElementById('t-spese').innerHTML = h;

  chart('c-cat', {type:'bar', data:{labels:catS.map(x => x[0]), datasets:[barDs('Imponibile', catS.map(x => x[1]), css('--s1'))]},

    chart('c-ftm', {type:'bar', data:{labels:MESI, datasets:[barDs('Fatture', fm, css('--s1'))]}, options:{scales:yEur}});
  }
  chart('c-spc', {type:'bar', data:{labels:scS.map(x => x[0]), datasets:[barDs('Con fattura', scS.map(x => x[1][0]), css('--s1')), barDs('Senza fattura', scS.map(x => x[1][1]), css('--s2'))]},
        options:{indexAxis:'y', interaction:{mode:'nearest', axis:'y', intersect:false}, scales:{x:{stacked:true, ticks:{callback:v => eurK(v)}}, y:{stacked:true, grid:{display:false}}}}});
}

/* ───────────── DIPENDENTI ───────────── */
function rDipendenti(){

    h += kpi('Netto in busta', eur(g.netto), 'pagato ai dipendenti');
    h += kpi('F24', eur(g.f24), 'ritenute IRPEF/INPS + INPS ditta (stima)');

    if (g.mancanti.length) h += alertBox('warn', `Mancano le paghe di: ${g.mancanti.map(ymLabel).join(', ')}`, 'I totali sono incompleti finché le buste paga di questi mesi non vengono lette dalla mail.');
    h += `<p class="note" style="margin-top:8px">TFR e ratei maturati nel periodo (non escono subito di cassa): ${eur(g.tfr + g.ratei)}.</p>`;
  }
  const Y = +p.to.slice(0,4), mesiY = MESI.map((_, i) => `${Y}-${String(i+1).padStart(2,'0')}`).filter(k => k <= ym(D.meta.ultima_chiusura));
  const neroM = k => sum(D.spese.filter(x => x[0].startsWith(k) && !x[5] && x[3] === 'Dipendente'), x => x[4]);
  const incM = k => sum(D.chiusure.filter(x => x[0].startsWith(k)), x => x[2]);
  h += `<div class="card"><h3>Mese per mese ${Y}</h3>` + legend([[css('--s1'),'Netto'],[css('--s3'),'F24'],[css('--s2'),'Nero']]) + `<div class="chart"><canvas id="c-pers"></canvas></div>`;
  h += `<div class="tbl-wrap" style="margin-top:12px"><table class="t"><thead><tr><th>Mese</th><th>Lordo</th><th>Netto</th><th>F24</th><th>Nero</th><th>Costo reale</th><th>% incasso</th></tr></thead><tbody>`;
  let T = [0,0,0,0,0,0];
  mesiY.forEach(k => {
    const q = D.paghe[k], n = neroM(k), inc = incM(k);
    const tot = (q ? q.netto + q.f24 : 0) + n;
    if (q){ T[0]+=q.lordo; T[1]+=q.netto; T[2]+=q.f24; } T[3]+=n; T[4]+=tot; T[5]+=inc;
    h += `<tr><td>${MESI[+k.slice(5)-1]}</td>` + (q ? `<td class="num">${eur(q.lordo)}</td><td class="num">${eur(q.netto)}</td><td class="num">${eur(q.f24)}</td>` : k >= ym(D.meta.ultima_chiusura) ? `<td colspan="3" style="color:var(--text-3)">in arrivo il mese prossimo</td>` : `<td colspan="3" style="color:var(--warn)">paghe mancanti</td>`) +
         `<td class="num">${eur(n)}</td><td class="num">${eur(tot)}</td><td>${pct(tot, inc)}</td></tr>`;
  });
  h += `<tr class="tot"><td>Totale</td><td class="num">${eur(T[0])}</td><td class="num">${eur(T[1])}</td><td class="num">${eur(T[2])}</td><td class="num">${eur(T[3])}</td><td class="num">${eur(T[4])}</td><td>${pct(T[4], T[5])}</td></tr></tbody></table></div></div>`;

  // buste per dipendente: ultimo mese del periodo con dati
  const mk = (g ? [...g.have].reverse()[0] : null) || Object.keys(D.paghe).sort().reverse()[0];
  h += `<div class="grid2"><div class="card"><h3>Buste paga ${mk ? ymLabel(mk) : ''}</h3><div class="sub">Ultimo mese del periodo con paghe lette</div>`;
  if (mk && D.paghe[mk].dip.length){
    h += `<div class="tbl-wrap"><table class="t"><thead><tr><th>Dipendente</th><th class="l">Mansione</th><th>Lordo</th><th>Netto</th></tr></thead><tbody>` +
         D.paghe[mk].dip.map(d => `<tr><td>${esc(d[0])}</td><td class="l">${esc(d[1])}</td><td class="num">${eur(d[2])}</td><td class="num">${eur(d[3])}</td></tr>`).join('') + `</tbody></table></div>`;
  } else h += `<div class="empty">Nessun dettaglio disponibile.</div>`;
  h += `</div>`;
  const np = {}; sl.righe.filter(x => !x[5] && x[3] === 'Dipendente').forEach(x => { np[x[2]] = (np[x[2]]||0) + x[4]; });
  h += `<div class="card"><h3>Nero per persona · ${S.locale}</h3><div class="sub">Dal modulo spese (campo fornitore), periodo selezionato</div>`;
  const npS = Object.entries(np).sort((a, b) => b[1] - a[1]);
  h += npS.length ? `<div class="tbl-wrap"><table class="t"><thead><tr><th>Nome</th><th>Totale</th></tr></thead><tbody>` + npS.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="num">${eur(v)}</td></tr>`).join('') + `<tr class="tot"><td>Totale</td><td class="num">${eur(sum(npS, x => x[1]))}</td></tr></tbody></table></div>` : `<div class="empty">Nessun pagamento in nero registrato nel periodo.</div>`;
  h += `</div></div>`;

  // turni
  const tm = p.mese || (D.turni.length ? D.turni.map(t => `${t[0]}-${String(t[1]).padStart(2,'0')}`).sort().reverse()[0] : null);
  h += `<h2 class="sec">Turni · ${S.locale}</h2>`;
  if (!tm) h += `<div class="empty">Nessun turno registrato.</div>`;
  else {
    const [ty, tmm] = tm.split('-').map(Number);
    const tt = D.turni.filter(t => t[0] === ty && t[1] === tmm && locOk(t[5]));
    const dips = [...new Set(tt.map(t => t[4]))].sort();
    const nd = new Date(ty, tmm, 0).getDate();
    h += `<div class="card"><h3>Griglia ${ymLabel(tm)}</h3><div class="sub"><span class="chip p">P</span> pranzo &nbsp; <span class="chip c">C</span> cena</div><div class="turni-wrap"><table class="turni"><thead><tr><th>Dipendente</th>` +
         Array.from({length:nd}, (_, i) => `<th>${i+1}</th>`).join('') + `<th>Tot</th></tr></thead><tbody>`;
    dips.forEach(dp => {
      h += `<tr><td class="n">${esc(dp)}</td>`;
      for (let g2 = 1; g2 <= nd; g2++){
        const x = tt.filter(t => t[2] === g2 && t[4] === dp);
        h += `<td>${x.some(t => t[3].startsWith('pranzo')) ? '<span class="chip p">P</span>' : ''}${x.some(t => t[3].startsWith('cena')) ? '<span class="chip c">C</span>' : ''}</td>`;
      }
      h += `<td><b>${tt.filter(t => t[4] === dp).length}</b></td></tr>`;
    });
    h += `</tbody></table></div>${dips.length ? '' : '<div class="empty">Nessun turno in questo mese.</div>'}</div>`;
  }
  document.getElementById('t-dipendenti').innerHTML = h;
  chart('c-pers', {type:'bar', data:{labels:mesiY.map(k => MESI[+k.slice(5)-1]), datasets:[
      barDs('Netto', mesiY.map(k => D.paghe[k]?.netto ?? null), css('--s1')),
      barDs('F24', mesiY.map(k => D.paghe[k]?.f24 ?? null), css('--s3')),
      barDs('Nero', mesiY.map(k => neroM(k) || null), css('--s2'))]},
    options:{scales:{x:{stacked:true, grid:{display:false}}, y:{stacked:true, ticks:{callback:v => eurK(v)}}}}});
}

/* ───────────── BILANCIO ───────────── */
function rBilancio(){
  const p = per(), B = bilancio(p, true);
  let h = `<h2 class="sec">Bilancio di cassa · ${esc(p.label)} · ${S.locale === 'Tutti' ? 'tutti i locali' : S.locale}</h2>`;
  if (!B.all) h += alertBox('info', `Vista ${esc(S.locale)}: solo il nero`, 'Fatture e buste paga sono intestate alla società e non si dividono per locale: il chiaro si vede solo su "Tutti".');
  const box = (l, v, ok) => `<div class="b ${v == null ? '' : v < 0 ? 'neg' : 'pos'}"><div class="l">${l}</div><div class="v num">${v == null ? '—' : eurS(v)}</div></div>`;
  h += `<div class="big3">` + box('Saldo chiaro', B.g && B.all ? B.chiaro : null) + box('Saldo nero', B.nero) + box('Saldo totale', B.g && B.all ? B.totale : null) + `</div>`;
  if (!B.all) {}
  else if (!B.g) h += alertBox('info', 'Personale non incluso', 'Per 7/30 giorni le paghe (mensili) non sono conteggiate: saldo chiaro e totale non sono disponibili.');
  else if (B.g.mancanti.filter(k => k < ym(D.meta.ultima_chiusura)).length) h += alertBox('warn', 'Saldo chiaro incompleto', `Mancano le paghe di ${B.g.mancanti.filter(k => k < ym(D.meta.ultima_chiusura)).map(ymLabel).join(', ')}.`);
  const r = (lbl, sub, v, cls) => `<div class="r ${cls}"><span>${lbl}${sub ? `<small>${sub}</small>` : ''}</span><span class="num">${v}</span></div>`;
  h += `<div class="grid2"><div class="card"><h3>Chiaro</h3><div class="sub">Quello che passa dai conti ufficiali${B.all ? '' : ' — <b>solo su Tutti</b>'}</div><div class="rows">` +
       r('Incasso fiscalizzato', 'carta + contanti − non fiscalizzato', eur(B.c.fisc), 'in') +
       r('Fatture fornitori', 'per data fattura, IVA inclusa', '−' + eur(B.f.tot), 'out') +
       r('Buste paga', 'netto + F24', B.g ? '−' + eur(B.pers) : 'n/d', 'out') +
       r('Saldo chiaro', '', B.g && B.all ? eurS(B.chiaro) : '—', 'saldo') + `</div></div>`;
  h += `<div class="card"><h3>Nero</h3><div class="sub">Quello che non passa dai conti ufficiali</div><div class="rows">` +
       r('Incassato non fiscalizzato', 'campo "Altro" delle chiusure', eur(B.c.nero), 'in') +
       r('Spese senza fattura', 'modulo spese, escluso personale', '−' + eur(B.s.neroAltro), 'out') +
       r('Dipendenti in nero', 'modulo spese, categoria Dipendente', '−' + eur(B.s.neroDip), 'out') +
       r('Saldo nero', B.nero < 0 ? 'pagato con soldi del chiaro' : '', eurS(B.nero), 'saldo') + `</div></div></div>`;

  // anno mese per mese
  const Y = +D.meta.ultima_chiusura.slice(0,4), mesiY = MESI.map((_, i) => `${Y}-${String(i+1).padStart(2,'0')}`).filter(k => k <= ym(D.meta.ultima_chiusura) && k >= ym(D.meta.inizio));
  const righe = mesiY.map(k => { const last = new Date(+k.slice(0,4), +k.slice(5), 0).getDate(); return [k, bilancio({from:k+'-01', to:`${k}-${last}`}, true)]; });
  let cum = 0; const cumA = righe.map(([, b]) => (cum += b.nero));
  h += `<div class="card"><h3>Nero mese per mese ${Y} · ${S.locale === 'Tutti' ? 'tutti i locali' : S.locale}</h3><div class="sub">Barre: entrato e uscito nel mese. Linea: saldo accumulato da gennaio. Sotto lo zero = nero pagato col chiaro.</div>` +
       legend([[css('--s1'),'Nero incassato'],[css('--s2'),'Nero speso'],[css('--text'),'Saldo accumulato']]) + `<div class="chart"><canvas id="c-nero"></canvas></div></div>`;
  h += `<div class="card"><h3>Riepilogo mensile ${Y}</h3><div class="tbl-wrap"><table class="t"><thead><tr><th>Mese</th><th>Incasso fisc.</th><th>Fatture</th><th>Buste paga</th><th>Saldo chiaro</th><th>Nero entrato</th><th>Nero uscito</th><th>Saldo nero</th><th>Nero accum.</th></tr></thead><tbody>`;
  righe.forEach(([k, b], i) => {
    const cl = v => v < 0 ? 'neg' : 'pos';
    h += `<tr><td>${MESI[+k.slice(5)-1]}</td><td class="num">${eur(b.c.fisc)}</td><td class="num">${eur(b.f.tot)}</td><td class="num">${b.g.have.length ? eur(b.pers) : k >= ym(D.meta.ultima_chiusura) ? '<span style="color:var(--text-3)">in arrivo</span>' : '<span style="color:var(--warn)">mancanti</span>'}</td><td class="num ${b.all ? cl(b.chiaro) : ''}">${b.all ? eurS(b.chiaro) : '—'}</td><td class="num">${eur(b.c.nero)}</td><td class="num">${eur(b.s.nonfatt)}</td><td class="num ${cl(b.nero)}">${eurS(b.nero)}</td><td class="num ${cl(cumA[i])}">${eurS(cumA[i])}</td></tr>`;
  });
  const T = righe.reduce((a, [, b]) => { a[0]+=b.c.fisc; a[1]+=b.f.tot; a[2]+=b.pers; a[3]+=b.chiaro || 0; a[4]+=b.c.nero; a[5]+=b.s.nonfatt; a[6]+=b.nero; return a; }, [0,0,0,0,0,0,0]);
  h += `<tr class="tot"><td>Totale</td>${T.slice(0,3).map(v => `<td class="num">${eur(v)}</td>`).join('')}<td class="num ${S.locale === 'Tutti' ? (T[3]<0?'neg':'pos') : ''}">${S.locale === 'Tutti' ? eurS(T[3]) : '—'}</td><td class="num">${eur(T[4])}</td><td class="num">${eur(T[5])}</td><td class="num ${T[6]<0?'neg':'pos'}">${eurS(T[6])}</td><td></td></tr></tbody></table></div></div>`;
  h += alertBox('info', 'Prossima fase: banca e carte', 'Quando caricherai l\'estratto conto (cartella "carica qui/banca") e gli estratti Amex e BCC ("carica qui/carte"), qui comparirà la cassa contanti: versamenti in banca, contanti che dovrebbero esserci e confronto con la cassa a bilancio.');
  document.getElementById('t-bilancio').innerHTML = h;
  chart('c-nero', {type:'bar', data:{labels:righe.map(([k]) => MESI[+k.slice(5)-1]), datasets:[
      lineDs('Saldo accumulato', cumA, css('--text'), {order:0}),
      barDs('Nero incassato', righe.map(([, b]) => b.c.nero), css('--s1'), {order:1}),
      barDs('Nero speso', righe.map(([, b]) => b.s.nonfatt), css('--s2'), {order:1})]},
    options:{scales:yEur}});
}

/* ───────────── avvio e navigazione ───────────── */
const RENDER = {riepilogo:rRiepilogo, incassi:rIncassi, spese:rSpese, dipendenti:rDipendenti, bilancio:rBilancio};
function render(){
  CHARTS.forEach(c => c.destroy()); CHARTS = [];
  document.querySelectorAll('section.tab').forEach(s => s.classList.toggle('on', s.id === 't-' + S.tab));
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === S.tab));
  document.querySelectorAll('#locale button').forEach(b => b.classList.toggle('on', b.dataset.l === S.locale));
  const p = per();
  document.getElementById('fnote').textContent = `${p.from.split('-').reverse().join('/')} → ${p.to.split('-').reverse().join('/')}`;
  try { RENDER[S.tab](); } catch(e){ document.getElementById('t-' + S.tab).innerHTML = alertBox('crit', 'Errore nella pagina', esc(e.message)); console.error(e); }
  try { sessionStorage.setItem('bonora_s', JSON.stringify(S)); } catch(e){}
}
function avvia(dati){
  D = dati;
  PERIODI = costruisciPeriodi();
  try { Object.assign(S, JSON.parse(sessionStorage.getItem('bonora_s') || '{}')); } catch(e){}
  if (!PERIODI.some(p => p.k === S.periodo)) S.periodo = 'ytd';
  const sel = document.getElementById('periodo');
  sel.innerHTML = PERIODI.map(p => `<option value="${p.k}">${esc(p.label)}</option>`).join('');
  sel.value = S.periodo;
  sel.onchange = () => { S.periodo = sel.value; render(); };
  document.querySelectorAll('#locale button').forEach(b => b.onclick = () => { S.locale = b.dataset.l; render(); });
  document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { S.tab = b.dataset.t; render(); window.scrollTo({top:0}); });
  document.getElementById('agg').textContent = `Aggiornato ${D.meta.generato} · ultima chiusura ${D.meta.ultima_chiusura.split('-').reverse().join('/')}`;
  document.getElementById('foot').textContent = `Dati dal ${D.meta.inizio.split('-').reverse().join('/')} · fatture fino al ${D.meta.ultima_fattura ? D.meta.ultima_fattura.split('-').reverse().join('/') : '—'} · spese fino al ${D.meta.ultima_spesa ? D.meta.ultima_spesa.split('-').reverse().join('/') : '—'}`;
  if (window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', render);
  render();
}
</script>
</body>
</html>
